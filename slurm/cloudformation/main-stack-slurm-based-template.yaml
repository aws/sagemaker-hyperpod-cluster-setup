        Version: 2012-10-17
        Statement:
          - Sid: ExecutionRolePolicies
            Effect: Allow
            Action:
              - iam:PutRolePolicy
              - iam:GetRolePolicy
              - iam:DeleteRolePolicy
            Resource:
              Fn::Split:
                - ','
                - Fn::Join:
                    - ''
                    - - arn:*:iam::*:role/
                      - Fn::Join:
                          - ',arn:*:iam::*:role/'
                          - Fn::Split:
                              - ','
                              - Fn::If:
                                  - HasInstanceGroupExecutionRoleNamesCondition
                                  - Fn::Join:
                                      - ','
                                      - - Fn::If:
                                            - HasSageMakerIAMRoleNameWithoutPathCondition
                                            - Ref: SageMakerIAMRoleNameWithoutPath
                                            - Fn::If:
                                                - CreateSageMakerIAMRoleStackCondition
                                                - Fn::GetAtt:
                                                    - IamRoleStack
                                                    - Outputs.AmazonSagemakerClusterExecutionRoleName
                                                - Ref: SageMakerIAMRoleName
                                        - Ref: InstanceGroupExecutionRoleNames
                                  - Fn::If:
                                      - HasSageMakerIAMRoleNameWithoutPathCondition
                                      - Ref: SageMakerIAMRoleNameWithoutPath
                                      - Fn::If:
                                          - CreateSageMakerIAMRoleStackCondition
                                          - Fn::GetAtt:
                                              - IamRoleStack
                                              - Outputs.AmazonSagemakerClusterExecutionRoleName
                                          - Ref: SageMakerIAMRoleName
    Metadata:
