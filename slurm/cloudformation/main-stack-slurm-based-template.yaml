      OpenZfsAvailabilityZoneId:
        default: FSx for OpenZFS Preferred Availability Zone
      OpenZfsDeploymentType:
        default: FSx for OpenZFS Deployment Type
      OpenZfsStorageCapacity:
        default: FSx for OpenZFS Storage Capacity (GiB)
      OpenZfsThroughputCapacity:
        default: FSx for OpenZFS Throughput Capacity (MB/s)
      OpenZfsMountPath:
        default: FSx for OpenZFS Mount Path
      AccountingDatabaseConfig:
        default: Accounting Database Config
      AccountingDatabaseSecretArn:
        default: Accounting Database Secret ARN
      CreateAccountingDatabase:
        default: Create New Accounting Database
      AccountingDatabaseInstanceClass:
        default: Accounting DB Instance Class
      AccountingDatabaseAllocatedStorage:
        default: Accounting DB Allocated Storage (GiB)
      AccountingDatabaseInstanceIdentifier:
        default: Accounting DB Instance Identifier
      AccountingDatabasePrimaryUsername:
        default: Accounting DB Primary Username
      AccountingDatabasePort:
        default: Accounting DB Port
      AccountingDatabaseName:
        default: Accounting DB Name
      AccountingDatabaseEngineVersion:
        default: Accounting DB Engine Version
Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues:
      - gamma
      - prod
    Description: Deployment stage (gamma, prod)
  ResourceNamePrefix:
    Type: String
    Default: sagemaker-hyperpod-slurm
    Description: Prefix to be used for all resources created by this template.
  CustomBucketName:
    Type: String
    Default: ''
    Description: Custom S3 bucket name to use for templates
  HyperPodClusterName:
    Type: String
    Default: slurm-hyper-pod
    Description: Name of SageMaker HyperPod Cluster.
  Tags:
    Type: String
    Default: ''
    Description: Custom tags for managing the SageMaker HyperPod cluster as an AWS resource.
  VpcId:
    Type: String
    Default: vpc-1234567890abcdef0
    Description: The ID of the VPC you wish to use if you do not want to create a new VPC.
  VpcCIDR:
    Type: String
    Default: 10.192.0.0/16
    Description: The IP range (CIDR notation) for the VPC.
  AvailabilityZoneIds:
    Type: String
    Default: use2-az1,use2-az2
    Description: List of AZs to deploy subnets in (up to 5, comma separated)
  SubnetCIDRs:
    Type: CommaDelimitedList
    Default: ',,,,'
    Description: >-
      Optional comma-separated list of secondary VPC CIDR blocks (one per AZ, up to 5) to use for the HyperPod private
      subnets. Leave any entry blank to fall back to auto-computed defaults (backward compatible).
  SecurityGroupId:
    Type: String
    Default: ''
    Description: The Id of cluster security group chosen from existing security group
  NodeRecovery:
    Type: String
    Default: Automatic
    AllowedValues:
      - Automatic
      - None
    Description: Specifies whether to enable or disable the automatic node recovery feature (Automatic or None).
  NodeProvisioningMode:
    Type: String
    Default: ''
    AllowedValues:
      - Continuous
      - ''
    Description: Enable or disable the continuous provisioning mode
  SlurmConfigStrategy:
    Type: String
    Default: ''
    AllowedValues:
      - Overwrite
      - Managed
      - Merge
      - ''
    Description: Strategy for managing Slurm configuration files (Overwrite, Managed, or Merge).
  AccountingDatabaseConfig:
    Type: String
    Default: ''
    Description: JSON config for the external Slurm accounting database ({Endpoint,Port,Name,SecretArn}).
  AccountingDatabaseSecretArn:
    Type: String
    Default: ''
    Description: ARN of the Secrets Manager secret holding the external accounting database credentials.
  CreateAccountingDatabase:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Set to "true" to provision a new Amazon RDS for MariaDB accounting database, "false" otherwise.
  AccountingDatabaseInstanceClass:
    Type: String
    Default: db.m5.large
    Description: The instance class for the newly provisioned accounting database.
  AccountingDatabaseAllocatedStorage:
    Type: Number
    Default: 20
    Description: The allocated storage (GiB) for the newly provisioned accounting database.
  AccountingDatabaseInstanceIdentifier:
    Type: String
    Default: ''
    Description: Optional identifier for the newly provisioned accounting database. Blank lets CloudFormation generate one.
  AccountingDatabasePrimaryUsername:
    Type: String
    Default: admin
    Description: The primary (master) username for the newly provisioned accounting database.
  AccountingDatabasePort:
    Type: Number
    Default: 3306
    Description: The port the newly provisioned accounting database listens on.
  AccountingDatabaseName:
    Type: String
    Default: ''
    Description: >-
      Optional accounting database name forwarded to the HyperPod API. Blank uses the HyperPod service default
      (slurm_acct_db_<clusterhash>); slurmdbd creates the database.
  AccountingDatabaseEngineVersion:
    Type: String
    Default: '11.8'
    AllowedPattern: ^\d+\.\d+(\.\d+)?$
    ConstraintDescription: Must be a MariaDB version such as 11.8 or 11.8.8.
    Description: >-
      MariaDB engine version for the newly provisioned accounting database, as <major>.<minor> or a full version. Also
      selects the DB parameter group family.
  SageMakerIAMRoleName:
    Type: String
    Default: role
    Description: The name of the IAM role that SageMaker will use to access the AWS resources on your behalf.
  SageMakerIAMRoleNameWithoutPath:
    Type: String
    Default: ''
    Description: >-
      The name of the existing IAM role in SageMakerIAMRoleName without its IAM path (for example Name for
      service-role/Name), for the observability policies attached to it. Empty uses SageMakerIAMRoleName.
  InstanceGroupExecutionRoleNames:
    Type: String
    Default: ''
    AllowedPattern: ^$|^[\w+=.@-]+(,[\w+=.@-]+)*$
    ConstraintDescription: must be comma-separated IAM role names (letters, digits and +=.@_-), without spaces, paths or ARNs.
    Description: >-
      Comma-separated names (without path or ARN) of the execution roles of instance groups that have their own, other
      than SageMakerIAMRoleName, for example team-b-role,team-c-role. The observability policies are attached to them
      too, since nodes send metrics as their instance group's execution role. Empty attaches them to the cluster
      execution role only. Used only with the observability extension.
  S3BucketName:
    Type: String
    Default: bucket
    Description: The name of the S3 bucket used to store the cluster lifecycle scripts.
  OnCreatePath:
    Type: String
    Default: ''
    Description: >-
      The file name of lifecycle script for the general purpose instance group. This script runs during cluster
      creation.
  OnInitCompletePath:
    Type: String
    Default: ''
    Description: The file name of the extension lifecycle script. This script runs after cluster creation is complete.
  EnableSourceS3UriOnly:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: >-
      When true, sends LifeCycleConfig with only SourceS3Uri (no OnCreate/OnInitComplete hooks). For allowlisted Slurm
      customers only.
  PrivateSubnetIds:
    Type: String
    Default: ''
    Description: Comma-separated list of private subnet IDs for EKS cluster.
  FsxSubnetId:
    Type: String
    Default: ''
    Description: The subnet id that will be used to create FSx
  FsxAvailabilityZoneId:
    Type: String
    Default: use2-az1
    Description: The availability zone to get subnet id that will be used to create FSx
  DeploymentType:
    Type: String
    Default: PERSISTENT_2
    Description: Deployment type for the FSx file system
  PerUnitStorageThroughput:
    Type: Number
    Default: 250
    Description: Per unit storage throughput for the FSx file system
  DataCompressionType:
    Type: String
    Default: LZ4
    AllowedValues:
      - NONE
      - LZ4
    Description: Data compression type for the FSx file system (NONE, LZ4)
  EfaEnabled:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Whether to enable EFA for the FSx file system
  FileSystemTypeVersion:
    Type: Number
    Default: 2.15
    Description: File system type version for the FSx file system
  StorageCapacity:
    Type: Number
    Default: 1200
    Description: Storage capacity for the FSx file system in GiB
  FsxFileSystemId:
    Type: String
    Default: ''
    Description: Existing FSx for Lustre file system
  OpenZfsFileSystemId:
    Type: String
    Default: ''
    Description: Existing FSx for OpenZFS file system
  OpenZfsAvailabilityZoneId:
    Type: String
    Default: ''
    Description: The availability zone id of the preferred FSx for OpenZFS file server subnet
  OpenZfsDeploymentType:
    Type: String
    Default: MULTI_AZ_1
    Description: Deployment type for the FSx for OpenZFS file system
  OpenZfsStorageCapacity:
    Type: Number
    Default: 200
    Description: Storage capacity for the FSx for OpenZFS file system in GiB
  OpenZfsThroughputCapacity:
    Type: Number
    Default: 160
    Description: Throughput capacity for the FSx for OpenZFS file system in MB/s
  OpenZfsMountPath:
    Type: String
    Default: /home
    Description: Local path on cluster instances where the FSx for OpenZFS file system is mounted
  CreateVPCStack:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Boolean to Create VPC Stack
  CreateLifeCycleScriptStack:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Boolean to Create Life Cycle Script Stack
  CreateS3BucketStack:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Boolean to Create a new bucket for Life Cycle Script
  CreateSecurityGroupStack:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Boolean to Create Security Group Stack
  CreateSageMakerIAMRoleStack:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Boolean to Create SageMaker IAM Role Stack
  CreateFsxStack:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Boolean to Create FSx for Lustre File System Stack
  CreateOpenZfsStack:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Boolean to Create FSx for OpenZFS File System Stack (new or existing file system)
  CreateHyperPodClusterStack:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Boolean to Create HyperPod Cluster Stack
  InstanceGroupSettings1:
    Type: String
    Default: >-
      [[{"InstanceGroupName":"controller-machine","InstanceType":"ml.c5.xlarge","InstanceGroupType":"Controller","InstanceCount":1,"ThreadsPerCore":1,"TargetAvailabilityZoneId":"use2-az1","SlurmConfig":{"NodeType":"Controller"}}],[{"InstanceGroupName":"compute-nodes","InstanceGroupType":"Compute","InstanceType":"ml.t3.medium","InstanceCount":4,"ThreadsPerCore":1,"TargetAvailabilityZoneId":"use2-az1","SlurmConfig":{"NodeType":"Compute"}}]]
    Description: JSON array string containing instance group configurations.
  InstanceGroupSettings2:
    Type: String
    Default: '[]'
    Description: JSON array string containing instance group configurations.
  InstanceGroupSettings3:
    Type: String
    Default: '[]'
    Description: JSON array string containing instance group configurations.
  InstanceGroupSettings4:
    Type: String
    Default: '[]'
    Description: JSON array string containing instance group configurations.
  InstanceGroupSettings5:
    Type: String
    Default: '[]'
    Description: JSON array string containing instance group configurations.
  InstanceGroupSettings6:
    Type: String
    Default: '[]'
    Description: JSON array string containing instance group configurations.
  InstanceGroupSettings7:
    Type: String
    Default: '[]'
    Description: JSON array string containing instance group configurations.
  InstanceGroupSettings8:
    Type: String
    Default: '[]'
    Description: JSON array string containing instance group configurations.
  InstanceGroupSettings9:
    Type: String
    Default: '[]'
    Description: JSON array string containing instance group configurations.
  InstanceGroupSettings10:
    Type: String
    Default: '[]'
    Description: JSON array string containing instance group configurations.
  InstanceGroupSettings11:
    Type: String
    Default: '[]'
    Description: JSON array string containing instance group configurations.
  InstanceGroupSettings12:
    Type: String
    Default: '[]'
    Description: JSON array string containing instance group configurations.
  InstanceGroupSettings13:
    Type: String
    Default: '[]'
    Description: JSON array string containing instance group configurations.
  InstanceGroupSettings14:
    Type: String
    Default: '[]'
    Description: JSON array string containing instance group configurations.
  InstanceGroupSettings15:
    Type: String
    Default: '[]'
    Description: JSON array string containing instance group configurations.
  InstanceGroupSettings16:
    Type: String
    Default: '[]'
    Description: JSON array string containing instance group configurations.
  InstanceGroupSettings17:
    Type: String
    Default: '[]'
    Description: JSON array string containing instance group configurations.
  InstanceGroupSettings18:
    Type: String
    Default: '[]'
    Description: JSON array string containing instance group configurations.
  InstanceGroupSettings19:
    Type: String
    Default: '[]'
    Description: JSON array string containing instance group configurations.
  InstanceGroupSettings20:
    Type: String
    Default: '[]'
    Description: JSON array string containing instance group configurations.
  EnableObservabilityFeature:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Set to "true" to enable observability, "false" otherwise.
  CreatePrometheusWorkspace:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Specify whether to create a new Prometheus workspace.
  PrometheusWorkspaceId:
    Type: String
    Default: ''
    Description: Existing Prometheus workspace ID.
  PrometheusWorkspaceArn:
    Type: String
    Default: ''
    Description: Existing Prometheus workspace ARN.
  PrometheusWorkspaceEndpoint:
    Type: String
    Default: ''
    Description: Existing Prometheus workspace endpoint.
  CreateGrafanaWorkspace:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
      - disabled
    Description: Specify whether to create a new Grafana workspace.
  GrafanaWorkspaceId:
    Type: String
    Default: ''
    Description: Existing Grafana workspace ID.
  GrafanaWorkspaceName:
    Type: String
    Default: ''
    Description: Existing Grafana workspace name.
  GrafanaWorkspaceArn:
    Type: String
    Default: ''
    Description: Existing Grafana workspace ARN.
  CreateGrafanaRole:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Specify whether to create a new Grafana role.
  GrafanaRole:
    Type: String
    Default: ''
    Description: Existing Grafana role ARN.
  NodeMetricLevel:
    Type: String
    Default: BASIC
    AllowedValues:
      - BASIC
      - ADVANCED
      - DISABLED
    Description: The level of node metrics.
  AcceleratedComputeMetricLevel:
    Type: String
    Default: BASIC
    AllowedValues:
      - BASIC
      - ADVANCED
      - DISABLED
    Description: The level of accelerated compute metrics.
  NetworkMetricLevel:
    Type: String
    Default: DISABLED
    AllowedValues:
      - BASIC
      - ADVANCED
      - DISABLED
    Description: The level of network metrics.
  ClusterMetricLevel:
    Type: String
    Default: BASIC
    AllowedValues:
      - BASIC
      - DISABLED
    Description: The level of cluster metrics.
  NcclMetricLevel:
    Type: String
    Default: DISABLED
    AllowedValues:
      - BASIC
      - DISABLED
    Description: The level of NCCL metrics.
  JobMetricLevel:
    Type: String
    Default: BASIC
    AllowedValues:
      - BASIC
      - DISABLED
    Description: The level of job metrics.
  MetricsDestination:
    Type: String
    Default: amp
    AllowedValues:
      - amp
      - cloudwatch
    Description: >-
      Where metrics go: amp (an Amazon Managed Service for Prometheus workspace) or cloudwatch (the stack installs the
      observability extension when it creates the cluster). Setting cloudwatch in an update of an existing stack is not
      supported: it would install the extension on the existing cluster and remove the node agent's config writer.
      Change the metric store from the cluster's Extensions tab.
  ClusterExtensions:
    Type: String
    Default: ''
    Description: >-
      Cluster extensions to install when the stack creates the cluster, as a JSON list of {"ExtensionName",
      "ConfigurationValues"}. Set, or with cloudwatch, the sagemaker-observability extension collects the metrics
      instead of the node agent, with the Prometheus remote-write URL (amp) and the Grafana workspace added to its
      configuration. Setting it in an update of an existing stack is not supported: it would install them on the
      existing cluster and remove the node agent's config writer. Install or change extensions from the cluster's
      Extensions tab.
Conditions:
  CreateVPCStackCondition:
    Fn::Equals:
      - Ref: CreateVPCStack
      - 'true'
  CreateLifeCycleScriptStackCondition:
    Fn::Equals:
      - Ref: CreateLifeCycleScriptStack
      - 'true'
  CreateS3BucketStackCondition:
    Fn::Equals:
      - Ref: CreateS3BucketStack
      - 'true'
  CreateS3BucketOnlyCondition:
    Fn::And:
      - Fn::Equals:
          - Ref: CreateS3BucketStack
          - 'true'
      - Fn::Equals:
          - Ref: CreateLifeCycleScriptStack
          - 'false'
  CreateSecurityGroupStackCondition:
    Fn::Equals:
      - Ref: CreateSecurityGroupStack
      - 'true'
  CreateSageMakerIAMRoleStackCondition:
    Fn::Equals:
      - Ref: CreateSageMakerIAMRoleStack
      - 'true'
  CreateFsxStackCondition:
    Fn::Equals:
      - Ref: CreateFsxStack
      - 'true'
  CreateOpenZfsStackCondition:
    Fn::Equals:
      - Ref: CreateOpenZfsStack
      - 'true'
  CustomBucketCondition:
    Fn::Not:
      - Fn::Equals:
          - Ref: CustomBucketName
          - ''
  CreateHyperPodClusterStackCondition:
    Fn::Equals:
      - Ref: CreateHyperPodClusterStack
      - 'true'
  SlurmConfigStrategyProvidedCondition:
    Fn::Not:
      - Fn::Equals:
          - Ref: SlurmConfigStrategy
          - ''
  CreateAccountingDatabaseCondition:
    Fn::Equals:
      - Ref: CreateAccountingDatabase
      - 'true'
  EnableObservabilityCondition:
    Fn::Equals:
      - Ref: EnableObservabilityFeature
      - 'true'
  HasClusterExtensionsCondition:
    Fn::Not:
      - Fn::Equals:
          - Ref: ClusterExtensions
          - ''
  InstallObservabilityExtensionCondition:
    Fn::And:
      - Condition: EnableObservabilityCondition
      - Fn::Or:
          - Fn::Equals:
              - Ref: MetricsDestination
              - cloudwatch
          - Condition: HasClusterExtensionsCondition
  HasSageMakerIAMRoleNameWithoutPathCondition:
    Fn::Not:
      - Fn::Equals:
          - Ref: SageMakerIAMRoleNameWithoutPath
          - ''
  ObservabilitySetupStackCondition:
    Fn::And:
      - Condition: InstallObservabilityExtensionCondition
      - Condition: CreateHyperPodClusterStackCondition
  NestedObservabilityStackCondition:
    Fn::And:
      - Condition: EnableObservabilityCondition
      - Fn::Not:
          - Condition: ObservabilitySetupStackCondition
  ClusterExtensionsCondition:
    Fn::And:
      - Condition: CreateHyperPodClusterStackCondition
      - Condition: HasClusterExtensionsCondition
  HasInstanceGroupExecutionRoleNamesCondition:
    Fn::Not:
      - Fn::Equals:
          - Ref: InstanceGroupExecutionRoleNames
          - ''
Resources:
  VPCStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL:
        Fn::If:
          - CustomBucketCondition
          - Fn::Sub: https://${CustomBucketName}.s3.${AWS::Region}.amazonaws.com/templates-slurm/slurm-vpc-template.yaml
          - Fn::Sub: >-
              https://aws-sagemaker-hyperpod-cluster-setup-${AWS::Region}-${Stage}.s3.${AWS::Region}.amazonaws.com/templates-slurm/slurm-vpc-template.yaml
      Parameters:
        ResourceNamePrefix:
          Ref: ResourceNamePrefix
        VpcCIDR:
          Ref: VpcCIDR
        AvailabilityZoneIds:
          Fn::Join:
            - ','
            - - Ref: AvailabilityZoneIds
              - ',,,'
        SubnetCIDRs:
          Fn::Join:
            - ','
            - - Fn::Join:
                  - ','
                  - Ref: SubnetCIDRs
              - ',,,,'
    Metadata:
      aws:cdk:path: MainSlurmBasedCfnTemplate/VPCStack
    Condition: CreateVPCStackCondition
  SecurityGroupStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL:
        Fn::If:
          - CustomBucketCondition
          - Fn::Sub: >-
              https://${CustomBucketName}.s3.${AWS::Region}.amazonaws.com/templates-slurm/slurm-security-group-template.yaml
          - Fn::Sub: >-
              https://aws-sagemaker-hyperpod-cluster-setup-${AWS::Region}-${Stage}.s3.${AWS::Region}.amazonaws.com/templates-slurm/slurm-security-group-template.yaml
      Parameters:
        ResourceNamePrefix:
          Ref: ResourceNamePrefix
        VpcId:
          Fn::If:
            - CreateVPCStackCondition
            - Fn::GetAtt:
                - VPCStack
                - Outputs.VpcId
            - Ref: VpcId
    Metadata:
      aws:cdk:path: MainSlurmBasedCfnTemplate/SecurityGroupStack
    Condition: CreateSecurityGroupStackCondition
  AccountingDatabaseStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL:
        Fn::If:
