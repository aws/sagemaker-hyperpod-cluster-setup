Description: Main Stack for Slurm based HyperPod Cluster
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: General Settings
        Parameters:
          - ResourceNamePrefix
          - Stage
          - CustomBucketName
          - NodeRecovery
          - NodeProvisioningMode
          - SlurmConfigStrategy
          - Tags
      - Label:
          default: HyperPod Cluster
        Parameters:
          - CreateHyperPodClusterStack
          - HyperPodClusterName
      - Label:
          default: Networking
        Parameters:
          - CreateVPCStack
          - VpcId
          - VpcCIDR
          - AvailabilityZoneIds
          - SubnetCIDRs
          - CreateSecurityGroupStack
          - SecurityGroupId
          - PrivateSubnetIds
      - Label:
          default: Lifecycle Configuration
        Parameters:
          - CreateLifeCycleScriptStack
          - CreateS3BucketStack
          - S3BucketName
          - OnCreatePath
          - OnInitCompletePath
          - EnableSourceS3UriOnly
      - Label:
          default: Permissions
        Parameters:
          - CreateSageMakerIAMRoleStack
          - SageMakerIAMRoleName
      - Label:
          default: Storage
        Parameters:
          - CreateFsxStack
          - FsxFileSystemId
          - FsxSubnetId
          - FsxAvailabilityZoneId
          - DeploymentType
          - StorageCapacity
          - PerUnitStorageThroughput
          - DataCompressionType
          - FileSystemTypeVersion
          - EfaEnabled
          - CreateOpenZfsStack
          - OpenZfsFileSystemId
          - OpenZfsAvailabilityZoneId
          - OpenZfsDeploymentType
          - OpenZfsStorageCapacity
          - OpenZfsThroughputCapacity
          - OpenZfsMountPath
      - Label:
          default: Accounting Database
        Parameters:
          - AccountingDatabaseConfig
          - AccountingDatabaseSecretArn
          - CreateAccountingDatabase
          - AccountingDatabaseInstanceClass
          - AccountingDatabaseAllocatedStorage
          - AccountingDatabaseInstanceIdentifier
          - AccountingDatabasePrimaryUsername
          - AccountingDatabasePort
          - AccountingDatabaseName
          - AccountingDatabaseEngineVersion
      - Label:
          default: Instance Groups
        Parameters:
          - InstanceGroupSettings1
          - InstanceGroupSettings2
          - InstanceGroupSettings3
          - InstanceGroupSettings4
          - InstanceGroupSettings5
          - InstanceGroupSettings6
          - InstanceGroupSettings7
          - InstanceGroupSettings8
          - InstanceGroupSettings9
          - InstanceGroupSettings10
          - InstanceGroupSettings11
          - InstanceGroupSettings12
          - InstanceGroupSettings13
          - InstanceGroupSettings14
          - InstanceGroupSettings15
          - InstanceGroupSettings16
          - InstanceGroupSettings17
          - InstanceGroupSettings18
          - InstanceGroupSettings19
          - InstanceGroupSettings20
    ParameterLabels:
      ResourceNamePrefix:
        default: Resource Name Prefix
      Stage:
        default: Deployment Stage
      CustomBucketName:
        default: Custom S3 Bucket Name
      NodeRecovery:
        default: Instance Recovery
      NodeProvisioningMode:
        default: Instance Provisioning Mode
      SlurmConfigStrategy:
        default: Slurm Configuration Strategy
      Tags:
        default: Resource Tags
      CreateHyperPodClusterStack:
        default: Create HyperPod Cluster
      HyperPodClusterName:
        default: HyperPod Cluster Name
      CreateVPCStack:
        default: Create New VPC
      VpcId:
        default: Existing VPC ID
      VpcCIDR:
        default: VPC CIDR Range
      AvailabilityZoneIds:
        default: Availability Zone IDs
      SubnetCIDRs:
        default: Subnet CIDR Blocks
      CreateSecurityGroupStack:
        default: Create New Security Group
      SecurityGroupId:
        default: Existing Security Group ID
      PrivateSubnetIds:
        default: Private Subnet IDs
      CreateLifeCycleScriptStack:
        default: Create Lifecycle Scripts
      CreateS3BucketStack:
        default: Create New S3 Bucket
      S3BucketName:
        default: S3 Bucket Name
      OnCreatePath:
        default: OnCreate Script Path
      OnInitCompletePath:
        default: OnInitComplete Script Path
      EnableSourceS3UriOnly:
        default: Enable Source S3 URI Only
      CreateSageMakerIAMRoleStack:
        default: Create New IAM Role
      SageMakerIAMRoleName:
        default: IAM Role Name
      CreateFsxStack:
        default: Create New FSx for Lustre File System
      FsxFileSystemId:
        default: Existing FSx File System ID
      FsxSubnetId:
        default: FSx Subnet ID
      FsxAvailabilityZoneId:
        default: FSx Availability Zone
      DeploymentType:
        default: Deployment type
      StorageCapacity:
        default: Storage Capacity (GB)
      PerUnitStorageThroughput:
        default: Per-unit Storage Throughput (MB/s/TiB)
      DataCompressionType:
        default: Compression Type
      FileSystemTypeVersion:
        default: Lustre Version
      EfaEnabled:
        default: Enable EFA
      CreateOpenZfsStack:
