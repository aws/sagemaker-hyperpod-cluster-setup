        Ref: ClusterExtensions
      InstallObservability: 'false'
      GrafanaWorkspaceId: ''
      RemoteWriteUrl: ''
      NodeMetricLevel:
        Ref: NodeMetricLevel
      AcceleratedComputeMetricLevel:
        Ref: AcceleratedComputeMetricLevel
      NetworkMetricLevel:
        Ref: NetworkMetricLevel
      ClusterMetricLevel:
        Ref: ClusterMetricLevel
