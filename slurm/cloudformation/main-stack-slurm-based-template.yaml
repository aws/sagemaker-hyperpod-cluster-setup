    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: ExecutionRolePoliciesAtPath
            Effect: Allow
            Action:
              - iam:PutRolePolicy
              - iam:GetRolePolicy
              - iam:DeleteRolePolicy
            Resource:
              Fn::Split:
                - ','
                - Fn::Join:
                    - ''
                    - - arn:*:iam::*:role/*/
                      - Fn::Join:
                          - ',arn:*:iam::*:role/*/'
                          - Fn::Split:
                              - ','
                              - Fn::If:
                                  - HasInstanceGroupExecutionRoleNamesCondition
                                  - Fn::Join:
                                      - ','
                                      - - Fn::If:
                                            - HasSageMakerIAMRoleNameWithoutPathCondition
                                            - Ref: SageMakerIAMRoleNameWithoutPath
                                            - Fn::If:
