Description: Sagemaker Hyperpod Slurm Observability Stack
Transform:
  - AWS::LanguageExtensions
Parameters:
  ResourceNamePrefix:
    Type: String
    Default: sagemaker-hyperpod-slurm
    Description: Prefix to be used for all resources created by this template.
  CustomResourceS3Bucket:
    Type: String
    Default: aws-sagemaker-hyperpod-cluster-setup-us-east-2-prod
    Description: The name of the S3 bucket containing the custom resource.
  GrafanaCustomResourceFunctionS3Key:
    Type: String
    Default: resources/artifacts/grafana-lambda-function.zip
    Description: The S3 key for the lambda function zip file.
  GrafanaCreatorfunctionS3Key:
    Type: String
    Default: resources/artifacts/observability-grafana-lambda-function.zip
    Description: The S3 key for the lambda function zip file.
  GrafanaServiceAccountfunctionS3Key:
    Type: String
    Default: resources/artifacts/grafana-service-token-lambda-function.zip
    Description: The S3 key for the lambda function zip file.
  ObservabilityAssetsS3Key:
    Type: String
    Default: resources/artifacts/observability-assets.zip
    Description: The S3 key for observability assets zip file.
  ConfigWriterFunctionS3Key:
    Type: String
    Default: resources/artifacts/slurm-observability-config-writer-lambda-function.zip
    Description: The S3 key for the config writer lambda function zip file.
  LCSBucketName:
    Type: String
    Description: S3 bucket where lifecycle scripts are stored.
  LCSConfigS3Key:
    Type: String
    Default: observability/observability-config.yaml
    Description: S3 key path for the observability-config.yaml file.
  CreateGrafanaRole:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Specify whether to create new role for Hyperpod Observability Grafana Custom Resources.
  GrafanaRole:
    Type: String
    Default: ''
    Description: The role to be used with Hyperpod Observability Grafana Custom Resources.
  ExecutionRoleName:
    Type: String
    Default: ''
    Description: The name of the cluster execution role.
  CreatePrometheusWorkspace:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Specify whether to create new prometheus workspace.
  PrometheusWorkspaceId:
    Type: String
    Default: ''
    Description: The ID of the existing Amazon Managed Service for Prometheus (AMP) workspace.
  PrometheusWorkspaceArn:
    Type: String
    Default: ''
    Description: The ARN of the existing Amazon Managed Service for Prometheus (AMP) workspace.
  PrometheusWorkspaceEndpoint:
    Type: String
    Default: ''
    Description: The Endpoint of the existing Amazon Managed Service for Prometheus (AMP) workspace.
  CreateGrafanaWorkspace:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
      - disabled
    Description: Specify whether to create new grafana workspace.
  GrafanaWorkspaceId:
    Type: String
    Default: ''
    Description: The ID of the existing Amazon Managed Service for Grafana (AMG) workspace.
  GrafanaWorkspaceName:
    Type: String
    Default: ''
    Description: The Name of the existing Amazon Managed Service for Grafana (AMG) workspace.
  GrafanaWorkspaceArn:
    Type: String
    Default: ''
    Description: The Arn of the existing Amazon Managed Service for Grafana (AMG) workspace.
  NodeMetricLevel:
    Type: String
    Default: BASIC
    AllowedValues:
      - BASIC
      - ADVANCED
      - DISABLED
    Description: The level of node metrics.
  AcceleratedComputeMetricLevel:
    Type: String
    Default: BASIC
    AllowedValues:
      - BASIC
      - ADVANCED
      - DISABLED
    Description: The level of accelerated compute metrics.
  NetworkMetricLevel:
    Type: String
    Default: DISABLED
    AllowedValues:
      - BASIC
      - ADVANCED
      - DISABLED
    Description: The level of network metrics.
  ClusterMetricLevel:
    Type: String
    Default: BASIC
    AllowedValues:
      - BASIC
      - DISABLED
    Description: The level of cluster metrics.
  NcclMetricLevel:
    Type: String
    Default: DISABLED
    AllowedValues:
      - BASIC
      - DISABLED
    Description: The level of NCCL metrics.
  JobMetricLevel:
    Type: String
    Default: BASIC
    AllowedValues:
      - BASIC
      - DISABLED
    Description: The level of job metrics.
  VpcId:
    Type: String
    Default: vpc-1234567890abcdef0
    Description: The ID of the VPC where endpoints will be created.
  SecurityGroupId:
    Type: String
    Default: ''
    Description: The security group of the VPC.
  PrivateSubnetIds:
    Type: CommaDelimitedList
    Default: subnet-1234567890abcdef0,subnet-1234567890abcdef1
    Description: List of private subnet IDs for VPC endpoints.
Mappings:
  AMGRegionMapping:
    us-east-1:
      isAllowed: 'true'
    us-east-2:
      isAllowed: 'true'
    us-west-2:
      isAllowed: 'true'
    ap-northeast-1:
      isAllowed: 'true'
    ap-southeast-1:
      isAllowed: 'true'
    ap-southeast-2:
      isAllowed: 'true'
    eu-central-1:
      isAllowed: 'true'
    eu-west-1:
      isAllowed: 'true'
    eu-west-2:
      isAllowed: 'true'
Conditions:
  IsAmgAllowed:
    Fn::And:
      - Fn::Equals:
          - Fn::FindInMap:
              - AMGRegionMapping
              - Ref: AWS::Region
              - isAllowed
              - DefaultValue: 'false'
          - 'true'
      - Fn::Not:
          - Fn::Equals:
              - Ref: CreateGrafanaWorkspace
              - disabled
  PrometheusNewWorkspaceCondition:
    Fn::Equals:
      - Ref: CreatePrometheusWorkspace
      - 'true'
  GrafanaNewWorkspaceCondition:
    Fn::And:
      - Fn::Equals:
          - Fn::FindInMap:
              - AMGRegionMapping
              - Ref: AWS::Region
              - isAllowed
              - DefaultValue: 'false'
          - 'true'
      - Fn::Not:
          - Fn::Equals:
              - Ref: CreateGrafanaWorkspace
              - disabled
      - Fn::Equals:
          - Ref: CreateGrafanaWorkspace
          - 'true'
  CreateGrafanaRoleCondition:
    Fn::And:
      - Fn::Equals:
          - Ref: CreateGrafanaRole
          - 'true'
      - Condition: IsAmgAllowed
Resources:
  GrafanaVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      PrivateDnsEnabled: true
      SecurityGroupIds:
        - Ref: SecurityGroupId
      ServiceName:
        Fn::Sub: com.amazonaws.${AWS::Region}.grafana-workspace
      SubnetIds:
        Fn::Split:
          - ','
          - Fn::Join:
              - ','
              - Ref: PrivateSubnetIds
      Tags:
        - Key: Name
          Value:
            Fn::Sub: ${ResourceNamePrefix}-gVpce
      VpcEndpointType: Interface
      VpcId:
        Ref: VpcId
    Metadata:
      aws:cdk:path: ObservabilitySlurmCfnTemplate/GrafanaVPCEndpoint
    Condition: IsAmgAllowed
  PrometheusVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      PrivateDnsEnabled: true
      SecurityGroupIds:
        - Ref: SecurityGroupId
      ServiceName:
        Fn::Sub: com.amazonaws.${AWS::Region}.aps-workspaces
      SubnetIds:
        Fn::Split:
          - ','
          - Fn::Join:
              - ','
              - Ref: PrivateSubnetIds
      Tags:
        - Key: Name
          Value:
            Fn::Sub: ${ResourceNamePrefix}-pVpce
      VpcEndpointType: Interface
      VpcId:
        Ref: VpcId
    Metadata:
      aws:cdk:path: ObservabilitySlurmCfnTemplate/PrometheusVPCEndpoint
  PrometheusWorkspace:
    Type: AWS::APS::Workspace
    Properties:
      Alias:
        Fn::Join:
          - '-'
          - - Fn::Sub: ${ResourceNamePrefix}
            - ampws
      Tags:
        - Key: SageMaker
          Value: 'true'
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Metadata:
      aws:cdk:path: ObservabilitySlurmCfnTemplate/PrometheusWorkspace
    Condition: PrometheusNewWorkspaceCondition
  ExecutionRoleObservabilityPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: PrometheusAccess
            Effect: Allow
            Action:
              - aps:RemoteWrite
            Resource:
              Fn::Sub:
                - arn:aws:aps:${AWS::Region}:${AWS::AccountId}:workspace/${PrometheusWorkspaceId}
                - PrometheusWorkspaceId:
                    Fn::If:
                      - PrometheusNewWorkspaceCondition
                      - Fn::GetAtt:
                          - PrometheusWorkspace
                          - WorkspaceId
                      - Ref: PrometheusWorkspaceId
      PolicyName:
        Fn::Sub: ${ResourceNamePrefix}-obs-policy
      Roles:
        - Ref: ExecutionRoleName
    Metadata:
      aws:cdk:path: ObservabilitySlurmCfnTemplate/ExecutionRoleObservabilityPolicy
  GrafanaWorkspaceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: GrafanaAssumeRole
            Effect: Allow
            Principal:
              Service: grafana.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount:
                  Fn::Sub: ${AWS::AccountId}
      Path: /service-role/
      Policies:
        - PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: AllowReadingMetricsFromPrometheus
                Effect: Allow
                Action:
                  - aps:ListWorkspaces
                  - aps:DescribeWorkspace
                  - aps:QueryMetrics
                  - aps:GetLabels
                  - aps:GetSeries
                  - aps:GetMetricMetadata
                Resource: arn:aws:aps:*:*:workspace/*
              - Sid: AllowListWorkspacesFromPrometheus
                Effect: Allow
                Action:
                  - aps:ListWorkspaces
                Resource: '*'
              - Sid: AllowReadingAlertsFromPrometheus
                Effect: Allow
                Action:
                  - aps:ListRules
                  - aps:ListAlertManagerSilences
                  - aps:ListAlertManagerAlerts
                  - aps:GetAlertManagerStatus
                  - aps:ListAlertManagerAlertGroups
                  - aps:PutAlertManagerSilences
                  - aps:DeleteAlertManagerSilence
                Resource: arn:aws:aps:*:*:workspace/*
          PolicyName:
            Fn::Sub: ${ResourceNamePrefix}-GraPol
      RoleName:
        Fn::Sub: ${ResourceNamePrefix}-GraAcc
    Metadata:
      aws:cdk:path: ObservabilitySlurmCfnTemplate/GrafanaWorkspaceRole
    Condition: CreateGrafanaRoleCondition
  GrafanaWorkspaceCustomResourceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
        Version: 2012-10-17
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonSageMakerHyperPodObservabilityAdminAccess
      Policies:
        - PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  Fn::If:
                    - CreateGrafanaRoleCondition
                    - Fn::GetAtt:
                        - GrafanaWorkspaceRole
                        - Arn
                    - Ref: GrafanaRole
          PolicyName:
            Fn::Sub: ${ResourceNamePrefix}-AMGIAM
        - PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - iam:CreateServiceLinkedRole
                Resource:
                  - Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/*
          PolicyName:
            Fn::Sub: ${ResourceNamePrefix}-AMGWSSLR
        - PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ec2:GetManagedPrefixListEntries
                  - kms:Decrypt
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:prefix-list/*
                  - Fn::Sub: arn:${AWS::Partition}:kms:*:${AWS::AccountId}:key/*
          PolicyName:
            Fn::Sub: ${ResourceNamePrefix}-AMGWSEC2
        - PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - sso:DescribeRegisteredRegions
                  - sso:GetSharedSsoConfiguration
                  - ec2:DescribeSubnets
                  - ec2:DescribeSubnetGroups
                  - organizations:DescribeOrganization
                Resource:
                  - '*'
          PolicyName:
            Fn::Sub: ${ResourceNamePrefix}-AMGWS
      RoleName:
        Fn::Sub: ${ResourceNamePrefix}-AMGWS
    Metadata:
      aws:cdk:path: ObservabilitySlurmCfnTemplate/GrafanaWorkspaceCustomResourceRole
    Condition: IsAmgAllowed
  GrafanaWorkspaceCustomResourceFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket:
          Ref: CustomResourceS3Bucket
        S3Key:
          Ref: GrafanaCreatorfunctionS3Key
      Environment:
        Variables:
          WORKSPACE_NAME:
            Fn::Join:
              - '-'
              - - Fn::Sub: ${ResourceNamePrefix}
                - amgws
          WORKSPACE_ROLE_ARN:
            Fn::If:
              - CreateGrafanaRoleCondition
              - Fn::GetAtt:
                  - GrafanaWorkspaceRole
                  - Arn
              - Ref: GrafanaRole
          REGION:
            Fn::Sub: ${AWS::Region}
          AWS_ACCOUNT_ID:
            Fn::Sub: ${AWS::AccountId}
          PARTITION:
            Fn::Sub: ${AWS::Partition}
      FunctionName:
        Fn::Sub: ${ResourceNamePrefix}-amg-crfn
      Handler: lambda_function.lambda_handler
      MemorySize: 2048
      Role:
        Fn::GetAtt:
          - GrafanaWorkspaceCustomResourceRole
          - Arn
      Runtime: python3.14
      Tags:
        - Key: SageMaker
          Value: 'true'
      Timeout: 900
    Metadata:
      aws:cdk:path: ObservabilitySlurmCfnTemplate/GrafanaWorkspaceCustomResourceFunction
    Condition: GrafanaNewWorkspaceCondition
  GrafanaWorkspaceCustomResource:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken:
        Fn::GetAtt:
          - GrafanaWorkspaceCustomResourceFunction
          - Arn
    Metadata:
      aws:cdk:path: ObservabilitySlurmCfnTemplate/GrafanaWorkspaceCustomResource
    Condition: GrafanaNewWorkspaceCondition
  GrafanaServiceAccountLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
        Version: 2012-10-17
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonSageMakerHyperPodObservabilityAdminAccess
      RoleName:
        Fn::Sub: ${ResourceNamePrefix}-SA
    Metadata:
      aws:cdk:path: ObservabilitySlurmCfnTemplate/GrafanaServiceAccountLambdaRole
    Condition: IsAmgAllowed
  GrafanaServiceAccountLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket:
          Ref: CustomResourceS3Bucket
        S3Key:
          Ref: GrafanaServiceAccountfunctionS3Key
      Environment:
        Variables:
          GRAFANA_WORKSPACE_ID:
            Fn::If:
              - GrafanaNewWorkspaceCondition
              - Fn::GetAtt:
                  - GrafanaWorkspaceCustomResource
                  - WorkspaceId
              - Ref: GrafanaWorkspaceId
          REGION:
            Fn::Sub: ${AWS::Region}
          SERVICE_ACCOUNT_NAME:
            Fn::Sub: ${ResourceNamePrefix}-SA
      FunctionName:
        Fn::Sub: ${ResourceNamePrefix}-SAfunc
      Handler: lambda_function.lambda_handler
      MemorySize: 2048
      Role:
        Fn::GetAtt:
          - GrafanaServiceAccountLambdaRole
          - Arn
      Runtime: python3.14
      Tags:
        - Key: SageMaker
          Value: 'true'
      Timeout: 900
    Metadata:
      aws:cdk:path: ObservabilitySlurmCfnTemplate/GrafanaServiceAccountLambdaFunction
    Condition: IsAmgAllowed
  GrafanaServiceAccountCustomResource:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken:
        Fn::GetAtt:
          - GrafanaServiceAccountLambdaFunction
          - Arn
    Metadata:
      aws:cdk:path: ObservabilitySlurmCfnTemplate/GrafanaServiceAccountCustomResource
    Condition: IsAmgAllowed
  GrafanaCustomResourceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
        Version: 2012-10-17
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:CreateTags
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*
                  - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*
                  - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*
                  - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/${VpcId}
              - Effect: Allow
                Action:
                  - ec2:DeleteNetworkInterface
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:*/*
              - Effect: Allow
                Action:
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                Resource: '*'
              - Effect: Allow
                Action:
                  - grafana:DeleteWorkspaceServiceAccount
                Resource:
                  Fn::Sub:
                    - arn:${AWS::Partition}:grafana:${AWS::Region}:${AWS::AccountId}:/workspaces/${GrafanaWorkspaceId}
                    - GrafanaWorkspaceId:
                        Fn::If:
                          - GrafanaNewWorkspaceCondition
                          - Fn::GetAtt:
                              - GrafanaWorkspaceCustomResource
                              - WorkspaceId
                          - Ref: GrafanaWorkspaceId
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  Fn::Sub:
                    - arn:aws:s3:::${CustomResourceS3Bucket}
                    - CustomResourceS3Bucket:
                        Ref: CustomResourceS3Bucket
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  Fn::Sub:
                    - arn:aws:s3:::${CustomResourceS3Bucket}/${ObservabilityAssetsS3Key}
                    - CustomResourceS3Bucket:
                        Ref: CustomResourceS3Bucket
                      ObservabilityAssetsS3Key:
                        Ref: ObservabilityAssetsS3Key
          PolicyName:
            Fn::Sub: ${ResourceNamePrefix}-AMGCR
      RoleName:
        Fn::Sub: ${ResourceNamePrefix}-AMGCR
    Metadata:
      aws:cdk:path: ObservabilitySlurmCfnTemplate/GrafanaCustomResourceRole
    Condition: IsAmgAllowed
  GrafanaCustomResourceFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket:
          Ref: CustomResourceS3Bucket
        S3Key:
          Ref: GrafanaCustomResourceFunctionS3Key
      Environment:
        Variables:
          GRAFANA_WORKSPACE_ID:
            Fn::If:
              - GrafanaNewWorkspaceCondition
              - Fn::GetAtt:
                  - GrafanaWorkspaceCustomResource
                  - WorkspaceId
              - Ref: GrafanaWorkspaceId
          PROMETHEUS_WORKSPACE_ID:
            Fn::If:
              - PrometheusNewWorkspaceCondition
              - Fn::GetAtt:
                  - PrometheusWorkspace
                  - WorkspaceId
              - Ref: PrometheusWorkspaceId
          GRAFANA_WORKSPACE_TOKEN_KEY:
            Fn::GetAtt:
              - GrafanaServiceAccountCustomResource
              - ServiceAccountTokenKey
          SERVICE_ACCOUNT_ID:
            Fn::GetAtt:
              - GrafanaServiceAccountCustomResource
              - ServiceAccountId
          REGION:
            Fn::Sub: ${AWS::Region}
          S3_BUCKET:
            Ref: CustomResourceS3Bucket
          DASHBOARD_PREFIX_S3_KEY:
            Ref: ObservabilityAssetsS3Key
          ORCHESTRATOR_TYPE: slurm
      FunctionName:
        Fn::Sub: ${ResourceNamePrefix}-grafunc
      Handler: lambda_function.lambda_handler
      MemorySize: 2048
      Role:
        Fn::GetAtt:
          - GrafanaCustomResourceRole
          - Arn
      Runtime: python3.14
      Tags:
        - Key: SageMaker
          Value: 'true'
      Timeout: 900
      VpcConfig:
        SecurityGroupIds:
          - Ref: SecurityGroupId
        SubnetIds:
          Fn::Split:
            - ','
            - Fn::Join:
                - ','
                - Ref: PrivateSubnetIds
    DependsOn:
      - GrafanaServiceAccountCustomResource
    Metadata:
      aws:cdk:path: ObservabilitySlurmCfnTemplate/GrafanaCustomResourceFunction
    Condition: IsAmgAllowed
  GrafanaHttpCustomResources:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken:
        Fn::GetAtt:
          - GrafanaCustomResourceFunction
          - Arn
    Metadata:
      aws:cdk:path: ObservabilitySlurmCfnTemplate/GrafanaHttpCustomResources
    Condition: IsAmgAllowed
  ConfigWriterLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
        Version: 2012-10-17
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  Fn::Sub: arn:aws:s3:::${LCSBucketName}/${LCSConfigS3Key}
          PolicyName:
            Fn::Sub: ${ResourceNamePrefix}-CfgWrS3
      RoleName:
        Fn::Sub: ${ResourceNamePrefix}-CfgWr
    Metadata:
      aws:cdk:path: ObservabilitySlurmCfnTemplate/ConfigWriterLambdaRole
  ConfigWriterLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket:
          Ref: CustomResourceS3Bucket
        S3Key:
          Ref: ConfigWriterFunctionS3Key
      Environment:
        Variables:
          LCS_BUCKET_NAME:
            Ref: LCSBucketName
          LCS_CONFIG_S3_KEY:
            Ref: LCSConfigS3Key
          AMP_REMOTE_WRITE_URL:
            Fn::Join:
              - ''
              - - https://aps-workspaces.
                - Fn::Sub: ${AWS::Region}
                - .amazonaws.com/workspaces/
                - Fn::If:
                    - PrometheusNewWorkspaceCondition
                    - Fn::GetAtt:
                        - PrometheusWorkspace
                        - WorkspaceId
                    - Ref: PrometheusWorkspaceId
                - /api/v1/remote_write
          AMP_WORKSPACE_ARN:
            Fn::If:
              - PrometheusNewWorkspaceCondition
              - Fn::GetAtt:
                  - PrometheusWorkspace
                  - Arn
              - Ref: PrometheusWorkspaceArn
          PROMETHEUS_ENDPOINT:
            Fn::If:
              - PrometheusNewWorkspaceCondition
              - Fn::GetAtt:
                  - PrometheusWorkspace
                  - PrometheusEndpoint
              - Ref: PrometheusWorkspaceEndpoint
          REGION:
            Fn::Sub: ${AWS::Region}
          AMG_WORKSPACE_NAME:
            Fn::If:
              - GrafanaNewWorkspaceCondition
              - Fn::GetAtt:
                  - GrafanaWorkspaceCustomResource
                  - WorkspaceId
              - Ref: GrafanaWorkspaceId
          AMG_WORKSPACE_ARN:
            Fn::If:
              - GrafanaNewWorkspaceCondition
              - Fn::GetAtt:
                  - GrafanaWorkspaceCustomResource
                  - Arn
              - Ref: GrafanaWorkspaceArn
          NODE_METRIC_LEVEL:
            Ref: NodeMetricLevel
          ACCELERATED_COMPUTE_METRIC_LEVEL:
            Ref: AcceleratedComputeMetricLevel
          NETWORK_METRIC_LEVEL:
            Ref: NetworkMetricLevel
          CLUSTER_METRIC_LEVEL:
            Ref: ClusterMetricLevel
          NCCL_METRIC_LEVEL:
            Ref: NcclMetricLevel
          JOB_METRIC_LEVEL:
            Ref: JobMetricLevel
      FunctionName:
        Fn::Sub: ${ResourceNamePrefix}-CfgWr
      Handler: lambda_function.lambda_handler
      MemorySize: 256
      Role:
        Fn::GetAtt:
          - ConfigWriterLambdaRole
          - Arn
      Runtime: python3.14
      Tags:
        - Key: SageMaker
          Value: 'true'
      Timeout: 60
    Metadata:
      aws:cdk:path: ObservabilitySlurmCfnTemplate/ConfigWriterLambdaFunction
  ConfigWriterCustomResource:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken:
        Fn::GetAtt:
          - ConfigWriterLambdaFunction
          - Arn
    Metadata:
      aws:cdk:path: ObservabilitySlurmCfnTemplate/ConfigWriterCustomResource
Outputs:
  AMPRemoteWriteURL:
    Description: AMP Remote Write URL for observability-config.yaml
    Value:
      Fn::Join:
        - ''
        - - https://aps-workspaces.
          - Fn::Sub: ${AWS::Region}
          - .amazonaws.com/workspaces/
          - Fn::If:
              - PrometheusNewWorkspaceCondition
              - Fn::GetAtt:
                  - PrometheusWorkspace
                  - WorkspaceId
              - Ref: PrometheusWorkspaceId
          - /api/v1/remote_write
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-AMPRemoteWriteURL
  PrometheusVPCEndpointId:
    Description: Prometheus VPC Endpoint ID
    Value:
      Ref: PrometheusVPCEndpoint
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-PrometheusVPCEndpointId
  HyperpodPrometheusWorkspaceId:
    Description: Prometheus Workspace ID
    Value:
      Fn::If:
        - PrometheusNewWorkspaceCondition
        - Fn::GetAtt:
            - PrometheusWorkspace
            - WorkspaceId
        - Ref: PrometheusWorkspaceId
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-PrometheusWorkspaceId
  HyperpodPrometheusWorkspaceArn:
    Description: Prometheus Workspace ARN
    Value:
      Fn::If:
        - PrometheusNewWorkspaceCondition
        - Fn::GetAtt:
            - PrometheusWorkspace
            - Arn
        - Ref: PrometheusWorkspaceArn
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-PrometheusWorkspaceArn
  HyperpodPrometheusWorkspaceEndpoint:
    Description: Prometheus Workspace Endpoint
    Value:
      Fn::If:
        - PrometheusNewWorkspaceCondition
        - Fn::GetAtt:
            - PrometheusWorkspace
            - PrometheusEndpoint
        - Ref: PrometheusWorkspaceEndpoint
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-PrometheusWorkspaceEndpoint
  HyperpodGrafanaWorkspaceId:
    Description: Grafana Workspace ID
    Value:
      Fn::If:
        - GrafanaNewWorkspaceCondition
        - Fn::GetAtt:
            - GrafanaWorkspaceCustomResource
            - WorkspaceId
        - Ref: GrafanaWorkspaceId
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-GrafanaWorkspaceId
    Condition: IsAmgAllowed
  HyperpodGrafanaWorkspaceArn:
    Description: Grafana Workspace ARN
    Value:
      Fn::If:
        - GrafanaNewWorkspaceCondition
        - Fn::GetAtt:
            - GrafanaWorkspaceCustomResource
            - Arn
        - Ref: GrafanaWorkspaceArn
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-GrafanaWorkspaceArn
    Condition: IsAmgAllowed
  GrafanaVPCEndpointId:
    Description: Grafana VPC Endpoint ID
    Value:
      Ref: GrafanaVPCEndpoint
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-GrafanaVPCEndpointId
    Condition: IsAmgAllowed
  ObservabilityConfigS3Uri:
    Description: S3 URI of the observability-config.yaml file
    Value:
      Fn::GetAtt:
        - ConfigWriterCustomResource
        - ConfigS3Uri
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-ObservabilityConfigS3Uri
