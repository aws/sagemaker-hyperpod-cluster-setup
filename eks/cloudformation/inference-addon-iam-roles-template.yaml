Description: IAM Roles for Inference Operator Addon
Parameters:
  ResourceNamePrefix:
    Type: String
    Default: sagemaker-hyperpod-eks
    Description: Prefix to be used for all resources created by this template.
  ResourceNameShortPrefix:
    Type: String
    Default: smhp1eks
    Description: Short prefix (8-char hash from UI) for resources with name length constraints.
  HyperPodClusterArn:
    Type: String
    Description: ARN of the HyperPod cluster.
  Stage:
    Type: String
    Default: prod
    AllowedValues:
      - gamma
      - prod
    Description: Deployment stage (gamma, prod)
  OIDCProviderURLWithoutProtocol:
    Type: String
    Description: The URL of the OIDC Provider without https:// prefix.
  VpcId:
    Type: String
    Default: vpc-1234567890abcdef0
    Description: The ID of the VPC.
  TlsCertificatesBucketName:
    Type: String
    Default: ''
    Description: Name of the S3 bucket for storing TLS certificates (optional)
  CreateS3CsiDriverRole:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Whether to create IAM role for S3 CSI Driver
  CreateFsxCsiDriverRole:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Whether to create IAM role for FSx CSI Driver
  CreateKedaRole:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Whether to create IAM role for KEDA
  CreateAlbControllerRole:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Whether to create IAM role for ALB Controller
  CreateJumpstartGatedModelRole:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Whether to create IAM role for JumpStart gated model download
  CreateInferenceOperatorExecutionRole:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Whether to create IAM role for Inference Operator execution
  RetainFsxCsiDriverStack:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Retain FSx CSI Driver stack resources
  RetainS3CsiDriverStack:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Retain S3 CSI Driver stack resources
  RetainCertManagerStack:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Retain Cert Manager stack resources
  RetainMetricsServerStack:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Retain Metrics Server stack resources
Conditions:
  ShouldCreateS3Role:
    Fn::Equals:
      - Ref: CreateS3CsiDriverRole
      - 'true'
  ShouldCreateFsxRole:
    Fn::Equals:
      - Ref: CreateFsxCsiDriverRole
      - 'true'
  ShouldCreateKedaRole:
    Fn::Equals:
      - Ref: CreateKedaRole
      - 'true'
  ShouldCreateAlbControllerRole:
    Fn::Equals:
      - Ref: CreateAlbControllerRole
      - 'true'
  ShouldCreateJumpstartGatedModelRole:
    Fn::Equals:
      - Ref: CreateJumpstartGatedModelRole
      - 'true'
  ShouldCreateInferenceOperatorExecutionRole:
    Fn::Equals:
      - Ref: CreateInferenceOperatorExecutionRole
      - 'true'
  RetainFsxRoleCondition:
    Fn::And:
      - Condition: ShouldCreateFsxRole
      - Fn::Equals:
          - Ref: RetainFsxCsiDriverStack
          - 'true'
  RetainS3RoleCondition:
    Fn::And:
      - Condition: ShouldCreateS3Role
      - Fn::Equals:
          - Ref: RetainS3CsiDriverStack
          - 'true'
Resources:
  S3MountpointPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName:
        Fn::Sub:
          - inf-${ResourceNameShortPrefix}-s3csi-policy-${UniqueSuffix}
          - ResourceNameShortPrefix:
              Ref: ResourceNameShortPrefix
            UniqueSuffix:
              Fn::Select:
                - 0
                - Fn::Split:
                    - '-'
                    - Fn::Select:
                        - 2
                        - Fn::Split:
                            - /
                            - Ref: AWS::StackId
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: MountpointFullBucketAccess
            Effect: Allow
            Action:
              - s3:ListBucket
            Resource:
              - arn:aws:s3:::*
          - Sid: MountpointObjectReadAccess
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:AbortMultipartUpload
              - s3:DeleteObject
            Resource:
              - arn:aws:s3:::*/*
    Metadata:
      aws:cdk:path: InferenceAddonIamRolesCfnTemplate/S3MountpointPolicy
    Condition: ShouldCreateS3Role
    DeletionPolicy:
      Fn::If:
        - RetainS3RoleCondition
        - RetainExceptOnCreate
        - Delete
  S3CsiDriverRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Fn::Sub: >-
          {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Federated":"arn:aws:iam::${AWS::AccountId}:oidc-provider/${OIDCProviderURLWithoutProtocol}"},"Action":["sts:AssumeRoleWithWebIdentity"],"Condition":{"StringEquals":{"${OIDCProviderURLWithoutProtocol}:aud":"sts.amazonaws.com","${OIDCProviderURLWithoutProtocol}:sub":"system:serviceaccount:kube-system:s3-csi-driver-sa"}}}]}
      ManagedPolicyArns:
        - Ref: S3MountpointPolicy
      Path: /
      RoleName:
        Fn::Sub:
          - inf-${ResourceNameShortPrefix}-s3csi-${UniqueSuffix}
          - ResourceNameShortPrefix:
              Ref: ResourceNameShortPrefix
            UniqueSuffix:
              Fn::Select:
                - 0
                - Fn::Split:
                    - '-'
                    - Fn::Select:
                        - 2
                        - Fn::Split:
                            - /
                            - Ref: AWS::StackId
    Metadata:
      aws:cdk:path: InferenceAddonIamRolesCfnTemplate/S3CsiDriverRole
    Condition: ShouldCreateS3Role
    DeletionPolicy:
      Fn::If:
        - RetainS3RoleCondition
        - RetainExceptOnCreate
        - Delete
  FsxCsiDriverRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Fn::Sub: >-
          {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Federated":"arn:aws:iam::${AWS::AccountId}:oidc-provider/${OIDCProviderURLWithoutProtocol}"},"Action":["sts:AssumeRoleWithWebIdentity"],"Condition":{"StringEquals":{"${OIDCProviderURLWithoutProtocol}:aud":"sts.amazonaws.com","${OIDCProviderURLWithoutProtocol}:sub":"system:serviceaccount:kube-system:fsx-csi-controller-sa"}}}]}
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonFSxFullAccess
      Path: /
      RoleName:
        Fn::Sub:
          - inf-${ResourceNameShortPrefix}-fsxcsi-${UniqueSuffix}
          - ResourceNameShortPrefix:
              Ref: ResourceNameShortPrefix
            UniqueSuffix:
              Fn::Select:
                - 0
                - Fn::Split:
                    - '-'
                    - Fn::Select:
                        - 2
                        - Fn::Split:
                            - /
                            - Ref: AWS::StackId
    Metadata:
      aws:cdk:path: InferenceAddonIamRolesCfnTemplate/FsxCsiDriverRole
    Condition: ShouldCreateFsxRole
    DeletionPolicy:
      Fn::If:
        - RetainFsxRoleCondition
        - RetainExceptOnCreate
        - Delete
  KedaPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName:
        Fn::Sub:
          - inf-${ResourceNameShortPrefix}-keda-policy-${UniqueSuffix}
          - ResourceNameShortPrefix:
              Ref: ResourceNameShortPrefix
            UniqueSuffix:
              Fn::Select:
                - 0
                - Fn::Split:
                    - '-'
                    - Fn::Select:
                        - 2
                        - Fn::Split:
                            - /
                            - Ref: AWS::StackId
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - cloudwatch:GetMetricData
              - cloudwatch:GetMetricStatistics
              - cloudwatch:ListMetrics
            Resource: '*'
          - Effect: Allow
            Action:
              - aps:QueryMetrics
              - aps:GetLabels
              - aps:GetSeries
              - aps:GetMetricMetadata
            Resource: '*'
    Metadata:
      aws:cdk:path: InferenceAddonIamRolesCfnTemplate/KedaPolicy
    Condition: ShouldCreateKedaRole
  KedaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Fn::Sub: >-
          {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Federated":"arn:aws:iam::${AWS::AccountId}:oidc-provider/${OIDCProviderURLWithoutProtocol}"},"Action":["sts:AssumeRoleWithWebIdentity"],"Condition":{"StringEquals":{"${OIDCProviderURLWithoutProtocol}:aud":"sts.amazonaws.com","${OIDCProviderURLWithoutProtocol}:sub":"system:serviceaccount:hyperpod-inference-system:keda-operator"}}}]}
      ManagedPolicyArns:
        - Ref: KedaPolicy
      Path: /
      RoleName:
        Fn::Sub:
          - inf-${ResourceNameShortPrefix}-keda-${UniqueSuffix}
          - ResourceNameShortPrefix:
              Ref: ResourceNameShortPrefix
            UniqueSuffix:
              Fn::Select:
                - 0
                - Fn::Split:
                    - '-'
                    - Fn::Select:
                        - 2
                        - Fn::Split:
                            - /
                            - Ref: AWS::StackId
    Metadata:
      aws:cdk:path: InferenceAddonIamRolesCfnTemplate/KedaRole
    Condition: ShouldCreateKedaRole
  AlbControllerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName:
        Fn::Sub:
          - inf-${ResourceNameShortPrefix}-lbc-policy-${UniqueSuffix}
          - ResourceNameShortPrefix:
              Ref: ResourceNameShortPrefix
            UniqueSuffix:
              Fn::Select:
                - 0
                - Fn::Split:
                    - '-'
                    - Fn::Select:
                        - 2
                        - Fn::Split:
                            - /
                            - Ref: AWS::StackId
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - iam:CreateServiceLinkedRole
            Resource: '*'
            Condition:
              StringEquals:
                iam:AWSServiceName: elasticloadbalancing.amazonaws.com
          - Effect: Allow
            Action:
              - ec2:DescribeAccountAttributes
              - ec2:DescribeAddresses
              - ec2:DescribeAvailabilityZones
              - ec2:DescribeInternetGateways
              - ec2:DescribeVpcs
              - ec2:DescribeVpcPeeringConnections
              - ec2:DescribeSubnets
              - ec2:DescribeSecurityGroups
              - ec2:DescribeInstances
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribeTags
              - ec2:GetCoipPoolUsage
              - ec2:DescribeCoipPools
              - ec2:GetSecurityGroupsForVpc
              - ec2:DescribeIpamPools
              - ec2:DescribeRouteTables
              - elasticloadbalancing:DescribeLoadBalancers
              - elasticloadbalancing:DescribeLoadBalancerAttributes
              - elasticloadbalancing:DescribeListeners
              - elasticloadbalancing:DescribeListenerCertificates
              - elasticloadbalancing:DescribeSSLPolicies
              - elasticloadbalancing:DescribeRules
              - elasticloadbalancing:DescribeTargetGroups
              - elasticloadbalancing:DescribeTargetGroupAttributes
              - elasticloadbalancing:DescribeTargetHealth
              - elasticloadbalancing:DescribeTags
              - elasticloadbalancing:DescribeTrustStores
              - elasticloadbalancing:DescribeListenerAttributes
              - elasticloadbalancing:DescribeCapacityReservation
            Resource: '*'
          - Effect: Allow
            Action:
              - cognito-idp:DescribeUserPoolClient
              - acm:ListCertificates
              - acm:DescribeCertificate
              - iam:ListServerCertificates
              - iam:GetServerCertificate
              - waf-regional:GetWebACL
              - waf-regional:GetWebACLForResource
              - waf-regional:AssociateWebACL
              - waf-regional:DisassociateWebACL
              - wafv2:GetWebACL
              - wafv2:GetWebACLForResource
              - wafv2:AssociateWebACL
              - wafv2:DisassociateWebACL
              - shield:GetSubscriptionState
              - shield:DescribeProtection
              - shield:CreateProtection
              - shield:DeleteProtection
            Resource: '*'
          - Effect: Allow
            Action:
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:RevokeSecurityGroupIngress
            Resource: '*'
          - Effect: Allow
            Action:
              - ec2:CreateSecurityGroup
            Resource: '*'
          - Effect: Allow
            Action:
              - ec2:CreateTags
            Resource: arn:aws:ec2:*:*:security-group/*
            Condition:
              StringEquals:
                ec2:CreateAction: CreateSecurityGroup
              'Null':
                aws:RequestTag/elbv2.k8s.aws/cluster: 'false'
          - Effect: Allow
            Action:
              - ec2:CreateTags
              - ec2:DeleteTags
            Resource: arn:aws:ec2:*:*:security-group/*
            Condition:
              'Null':
                aws:RequestTag/elbv2.k8s.aws/cluster: 'true'
                aws:ResourceTag/elbv2.k8s.aws/cluster: 'false'
          - Effect: Allow
            Action:
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:RevokeSecurityGroupIngress
              - ec2:DeleteSecurityGroup
            Resource: '*'
            Condition:
              'Null':
                aws:ResourceTag/elbv2.k8s.aws/cluster: 'false'
          - Effect: Allow
            Action:
              - elasticloadbalancing:CreateLoadBalancer
              - elasticloadbalancing:CreateTargetGroup
            Resource: '*'
            Condition:
              'Null':
                aws:RequestTag/elbv2.k8s.aws/cluster: 'false'
          - Effect: Allow
            Action:
              - elasticloadbalancing:CreateListener
              - elasticloadbalancing:DeleteListener
              - elasticloadbalancing:CreateRule
              - elasticloadbalancing:DeleteRule
            Resource: '*'
          - Effect: Allow
            Action:
              - elasticloadbalancing:AddTags
              - elasticloadbalancing:RemoveTags
            Resource:
              - arn:aws:elasticloadbalancing:*:*:targetgroup/*/*
              - arn:aws:elasticloadbalancing:*:*:loadbalancer/net/*/*
              - arn:aws:elasticloadbalancing:*:*:loadbalancer/app/*/*
            Condition:
              'Null':
                aws:RequestTag/elbv2.k8s.aws/cluster: 'true'
                aws:ResourceTag/elbv2.k8s.aws/cluster: 'false'
          - Effect: Allow
            Action:
              - elasticloadbalancing:AddTags
              - elasticloadbalancing:RemoveTags
            Resource:
              - arn:aws:elasticloadbalancing:*:*:listener/net/*/*/*
              - arn:aws:elasticloadbalancing:*:*:listener/app/*/*/*
              - arn:aws:elasticloadbalancing:*:*:listener-rule/net/*/*/*
              - arn:aws:elasticloadbalancing:*:*:listener-rule/app/*/*/*
          - Effect: Allow
            Action:
              - elasticloadbalancing:ModifyLoadBalancerAttributes
              - elasticloadbalancing:SetIpAddressType
              - elasticloadbalancing:SetSecurityGroups
              - elasticloadbalancing:SetSubnets
              - elasticloadbalancing:DeleteLoadBalancer
              - elasticloadbalancing:ModifyTargetGroup
              - elasticloadbalancing:ModifyTargetGroupAttributes
              - elasticloadbalancing:DeleteTargetGroup
              - elasticloadbalancing:ModifyListenerAttributes
              - elasticloadbalancing:ModifyCapacityReservation
              - elasticloadbalancing:ModifyIpPools
            Resource: '*'
            Condition:
              'Null':
                aws:ResourceTag/elbv2.k8s.aws/cluster: 'false'
          - Effect: Allow
            Action:
              - elasticloadbalancing:AddTags
            Resource:
              - arn:aws:elasticloadbalancing:*:*:targetgroup/*/*
              - arn:aws:elasticloadbalancing:*:*:loadbalancer/net/*/*
              - arn:aws:elasticloadbalancing:*:*:loadbalancer/app/*/*
            Condition:
              StringEquals:
                elasticloadbalancing:CreateAction:
                  - CreateTargetGroup
                  - CreateLoadBalancer
              'Null':
                aws:RequestTag/elbv2.k8s.aws/cluster: 'false'
          - Effect: Allow
            Action:
              - elasticloadbalancing:RegisterTargets
              - elasticloadbalancing:DeregisterTargets
            Resource: arn:aws:elasticloadbalancing:*:*:targetgroup/*/*
          - Effect: Allow
            Action:
              - elasticloadbalancing:SetWebAcl
              - elasticloadbalancing:ModifyListener
              - elasticloadbalancing:AddListenerCertificates
              - elasticloadbalancing:RemoveListenerCertificates
              - elasticloadbalancing:ModifyRule
              - elasticloadbalancing:SetRulePriorities
            Resource: '*'
    Metadata:
      aws:cdk:path: InferenceAddonIamRolesCfnTemplate/AlbControllerPolicy
    Condition: ShouldCreateAlbControllerRole
  AlbControllerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Fn::Sub: >-
          {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Federated":"arn:aws:iam::${AWS::AccountId}:oidc-provider/${OIDCProviderURLWithoutProtocol}"},"Action":["sts:AssumeRoleWithWebIdentity"],"Condition":{"StringEquals":{"${OIDCProviderURLWithoutProtocol}:aud":"sts.amazonaws.com","${OIDCProviderURLWithoutProtocol}:sub":"system:serviceaccount:hyperpod-inference-system:aws-load-balancer-controller"}}}]}
      ManagedPolicyArns:
        - Ref: AlbControllerPolicy
      Path: /
      RoleName:
        Fn::Sub:
          - inf-${ResourceNameShortPrefix}-lbc-${UniqueSuffix}
          - ResourceNameShortPrefix:
              Ref: ResourceNameShortPrefix
            UniqueSuffix:
              Fn::Select:
                - 0
                - Fn::Split:
                    - '-'
                    - Fn::Select:
                        - 2
                        - Fn::Split:
                            - /
                            - Ref: AWS::StackId
    Metadata:
      aws:cdk:path: InferenceAddonIamRolesCfnTemplate/AlbControllerRole
    Condition: ShouldCreateAlbControllerRole
  JumpstartGatedModelRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Fn::Sub: >-
          {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"sagemaker.amazonaws.com"},"Action":"sts:AssumeRole"},{"Effect":"Allow","Principal":{"Federated":"arn:aws:iam::${AWS::AccountId}:oidc-provider/${OIDCProviderURLWithoutProtocol}"},"Action":"sts:AssumeRoleWithWebIdentity","Condition":{"StringLike":{"${OIDCProviderURLWithoutProtocol}:aud":"sts.amazonaws.com","${OIDCProviderURLWithoutProtocol}:sub":"system:serviceaccount:*:hyperpod-inference-service-account*"}}}]}
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSageMakerHyperPodGatedModelAccess
      Path: /
      RoleName:
        Fn::Sub:
          - inf-${ResourceNameShortPrefix}-gate-${UniqueSuffix}
          - ResourceNameShortPrefix:
              Ref: ResourceNameShortPrefix
            UniqueSuffix:
              Fn::Select:
                - 0
                - Fn::Split:
                    - '-'
                    - Fn::Select:
                        - 2
                        - Fn::Split:
                            - /
                            - Ref: AWS::StackId
    Metadata:
      aws:cdk:path: InferenceAddonIamRolesCfnTemplate/JumpstartGatedModelRole
    Condition: ShouldCreateJumpstartGatedModelRole
  InferenceOperatorExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Fn::Sub: >-
          {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"sagemaker.amazonaws.com"},"Action":"sts:AssumeRole"},{"Effect":"Allow","Principal":{"Federated":"arn:aws:iam::${AWS::AccountId}:oidc-provider/${OIDCProviderURLWithoutProtocol}"},"Action":"sts:AssumeRoleWithWebIdentity","Condition":{"StringLike":{"${OIDCProviderURLWithoutProtocol}:aud":"sts.amazonaws.com","${OIDCProviderURLWithoutProtocol}:sub":"system:serviceaccount:hyperpod-inference-system:hyperpod-inference-controller-manager"}}}]}
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSageMakerHyperPodInferenceAccess
      Path: /
      RoleName:
        Fn::Sub:
          - SageMakerHyperPodInference-${UniqueSuffix}
          - UniqueSuffix:
              Fn::Select:
                - 0
                - Fn::Split:
                    - '-'
                    - Fn::Select:
                        - 2
                        - Fn::Split:
                            - /
                            - Ref: AWS::StackId
    Metadata:
      aws:cdk:path: InferenceAddonIamRolesCfnTemplate/InferenceOperatorExecutionRole
    Condition: ShouldCreateInferenceOperatorExecutionRole
Outputs:
  S3CsiDriverRoleArn:
    Description: ARN of the IAM role for S3 CSI Driver
    Value:
      Fn::GetAtt:
        - S3CsiDriverRole
        - Arn
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-S3CsiDriverRoleArn
    Condition: ShouldCreateS3Role
  FsxCsiDriverRoleArn:
    Description: ARN of the IAM role for FSx CSI Driver
    Value:
      Fn::GetAtt:
        - FsxCsiDriverRole
        - Arn
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-FsxCsiDriverRoleArn
    Condition: ShouldCreateFsxRole
  KedaRoleArn:
    Description: ARN of the IAM role for KEDA
    Value:
      Fn::GetAtt:
        - KedaRole
        - Arn
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-KedaRoleArn
    Condition: ShouldCreateKedaRole
  AlbControllerRoleArn:
    Description: ARN of the IAM role for ALB Controller
    Value:
      Fn::GetAtt:
        - AlbControllerRole
        - Arn
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-AlbControllerRoleArn
    Condition: ShouldCreateAlbControllerRole
  JumpstartGatedModelRoleArn:
    Description: ARN of the IAM role for JumpStart gated model download
    Value:
      Fn::GetAtt:
        - JumpstartGatedModelRole
        - Arn
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-JumpstartGatedModelRoleArn
    Condition: ShouldCreateJumpstartGatedModelRole
  InferenceOperatorExecutionRoleArn:
    Description: ARN of the IAM role for Inference Operator execution role
    Value:
      Fn::GetAtt:
        - InferenceOperatorExecutionRole
        - Arn
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-InferenceOperatorExecutionRoleArn
    Condition: ShouldCreateInferenceOperatorExecutionRole
  InferenceOperatorExecutionRoleName:
    Description: Name of the IAM role for Inference Operator execution role
    Value:
      Fn::Sub:
        - SageMakerHyperPodInference-${UniqueSuffix}
        - UniqueSuffix:
            Fn::Select:
              - 0
              - Fn::Split:
                  - '-'
                  - Fn::Select:
                      - 2
                      - Fn::Split:
                          - /
                          - Ref: AWS::StackId
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-InferenceOperatorExecutionRoleName
    Condition: ShouldCreateInferenceOperatorExecutionRole
