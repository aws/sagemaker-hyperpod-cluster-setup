Description: IAM Roles for Inference Operator Addon
Parameters:
  ResourceNamePrefix:
    Type: String
    Default: sagemaker-hyperpod-eks
    Description: Prefix to be used for all resources created by this template.
  Stage:
    Type: String
    Default: prod
    AllowedValues:
      - gamma
      - prod
    Description: Deployment stage (gamma, prod)
  OIDCProviderURLWithoutProtocol:
    Type: String
    Description: The URL of the OIDC Provider without https:// prefix.
  VpcId:
    Type: String
    Default: vpc-1234567890abcdef0
    Description: The ID of the VPC.
  TlsCertificatesBucketName:
    Type: String
    Default: ''
    Description: Name of the S3 bucket for storing TLS certificates (optional)
  CreateS3CsiDriverRole:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Whether to create IAM role for S3 CSI Driver
  CreateFsxCsiDriverRole:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Whether to create IAM role for FSx CSI Driver
  CreateKedaRole:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Whether to create IAM role for KEDA
  CreateAlbControllerRole:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Whether to create IAM role for ALB Controller
  CreateJumpstartGatedModelRole:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Whether to create IAM role for JumpStart gated model download
  CreateInferenceOperatorExecutionRole:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Whether to create IAM role for Inference Operator execution
  BootstrapVersion:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /cdk-bootstrap/hnb659fds/version
    Description: >-
      Version of the CDK Bootstrap resources in this environment, automatically retrieved from SSM Parameter Store.
      [cdk:skip]
Conditions:
  ShouldCreateS3Role:
    Fn::Equals:
      - Ref: CreateS3CsiDriverRole
      - 'true'
  ShouldCreateFsxRole:
    Fn::Equals:
      - Ref: CreateFsxCsiDriverRole
      - 'true'
  ShouldCreateKedaRole:
    Fn::Equals:
      - Ref: CreateKedaRole
      - 'true'
  ShouldCreateAlbControllerRole:
    Fn::Equals:
      - Ref: CreateAlbControllerRole
      - 'true'
  ShouldCreateJumpstartGatedModelRole:
    Fn::Equals:
      - Ref: CreateJumpstartGatedModelRole
      - 'true'
  ShouldCreateInferenceOperatorExecutionRole:
    Fn::Equals:
      - Ref: CreateInferenceOperatorExecutionRole
      - 'true'
  CDKMetadataAvailable:
    Fn::Or:
      - Fn::Or:
          - Fn::Equals:
              - Ref: AWS::Region
              - af-south-1
          - Fn::Equals:
              - Ref: AWS::Region
              - ap-east-1
          - Fn::Equals:
              - Ref: AWS::Region
              - ap-northeast-1
          - Fn::Equals:
              - Ref: AWS::Region
              - ap-northeast-2
          - Fn::Equals:
              - Ref: AWS::Region
              - ap-northeast-3
          - Fn::Equals:
              - Ref: AWS::Region
              - ap-south-1
          - Fn::Equals:
              - Ref: AWS::Region
              - ap-south-2
          - Fn::Equals:
              - Ref: AWS::Region
              - ap-southeast-1
          - Fn::Equals:
              - Ref: AWS::Region
              - ap-southeast-2
          - Fn::Equals:
              - Ref: AWS::Region
              - ap-southeast-3
      - Fn::Or:
          - Fn::Equals:
              - Ref: AWS::Region
              - ap-southeast-4
          - Fn::Equals:
              - Ref: AWS::Region
              - ca-central-1
          - Fn::Equals:
              - Ref: AWS::Region
              - ca-west-1
          - Fn::Equals:
              - Ref: AWS::Region
              - cn-north-1
          - Fn::Equals:
              - Ref: AWS::Region
              - cn-northwest-1
          - Fn::Equals:
              - Ref: AWS::Region
              - eu-central-1
          - Fn::Equals:
              - Ref: AWS::Region
              - eu-central-2
          - Fn::Equals:
              - Ref: AWS::Region
              - eu-north-1
          - Fn::Equals:
              - Ref: AWS::Region
              - eu-south-1
          - Fn::Equals:
              - Ref: AWS::Region
              - eu-south-2
      - Fn::Or:
          - Fn::Equals:
              - Ref: AWS::Region
              - eu-west-1
          - Fn::Equals:
              - Ref: AWS::Region
              - eu-west-2
          - Fn::Equals:
              - Ref: AWS::Region
              - eu-west-3
          - Fn::Equals:
              - Ref: AWS::Region
              - il-central-1
          - Fn::Equals:
              - Ref: AWS::Region
              - me-central-1
          - Fn::Equals:
              - Ref: AWS::Region
              - me-south-1
          - Fn::Equals:
              - Ref: AWS::Region
              - sa-east-1
          - Fn::Equals:
              - Ref: AWS::Region
              - us-east-1
          - Fn::Equals:
              - Ref: AWS::Region
              - us-east-2
          - Fn::Equals:
              - Ref: AWS::Region
              - us-west-1
      - Fn::Equals:
          - Ref: AWS::Region
          - us-west-2
Resources:
  S3MountpointPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName:
        Fn::Sub: ${ResourceNamePrefix}-s3-csi-driver-policy
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: MountpointFullBucketAccess
            Effect: Allow
            Action:
              - s3:ListBucket
            Resource:
              - arn:aws:s3:::*
          - Sid: MountpointObjectReadAccess
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:AbortMultipartUpload
              - s3:DeleteObject
            Resource:
              - arn:aws:s3:::*/*
    Metadata:
      aws:cdk:path: InferenceAddonIamRolesCfnTemplate/S3MountpointPolicy
    Condition: ShouldCreateS3Role
  S3CsiDriverRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Fn::Sub: >-
          {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Federated":"arn:aws:iam::${AWS::AccountId}:oidc-provider/${OIDCProviderURLWithoutProtocol}"},"Action":["sts:AssumeRoleWithWebIdentity"],"Condition":{"StringEquals":{"${OIDCProviderURLWithoutProtocol}:aud":"sts.amazonaws.com","${OIDCProviderURLWithoutProtocol}:sub":"system:serviceaccount:kube-system:s3-csi-driver-sa"}}}]}
      ManagedPolicyArns:
        - Ref: S3MountpointPolicy
      Path: /
      RoleName:
        Fn::Sub: ${ResourceNamePrefix}-s3-csi-driver-role
    Metadata:
      aws:cdk:path: InferenceAddonIamRolesCfnTemplate/S3CsiDriverRole
    Condition: ShouldCreateS3Role
  FsxCsiDriverRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Fn::Sub: >-
          {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Federated":"arn:aws:iam::${AWS::AccountId}:oidc-provider/${OIDCProviderURLWithoutProtocol}"},"Action":["sts:AssumeRoleWithWebIdentity"],"Condition":{"StringEquals":{"${OIDCProviderURLWithoutProtocol}:aud":"sts.amazonaws.com","${OIDCProviderURLWithoutProtocol}:sub":"system:serviceaccount:kube-system:fsx-csi-controller-sa"}}}]}
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonFSxFullAccess
      Path: /
      RoleName:
        Fn::Sub: ${ResourceNamePrefix}-fsx-csi-driver-role
    Metadata:
      aws:cdk:path: InferenceAddonIamRolesCfnTemplate/FsxCsiDriverRole
    Condition: ShouldCreateFsxRole
  KedaPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName:
        Fn::Sub: ${ResourceNamePrefix}-keda-policy
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - cloudwatch:GetMetricData
              - cloudwatch:GetMetricStatistics
              - cloudwatch:ListMetrics
            Resource: '*'
          - Effect: Allow
            Action:
              - aps:QueryMetrics
              - aps:GetLabels
              - aps:GetSeries
              - aps:GetMetricMetadata
            Resource: '*'
    Metadata:
      aws:cdk:path: InferenceAddonIamRolesCfnTemplate/KedaPolicy
    Condition: ShouldCreateKedaRole
  KedaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Fn::Sub: >-
          {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Federated":"arn:aws:iam::${AWS::AccountId}:oidc-provider/${OIDCProviderURLWithoutProtocol}"},"Action":["sts:AssumeRoleWithWebIdentity"],"Condition":{"StringEquals":{"${OIDCProviderURLWithoutProtocol}:aud":"sts.amazonaws.com","${OIDCProviderURLWithoutProtocol}:sub":"system:serviceaccount:hyperpod-inference-system:keda-operator"}}}]}
      ManagedPolicyArns:
        - Ref: KedaPolicy
      Path: /
      RoleName:
        Fn::Sub: ${ResourceNamePrefix}-keda-role
    Metadata:
      aws:cdk:path: InferenceAddonIamRolesCfnTemplate/KedaRole
    Condition: ShouldCreateKedaRole
  AlbControllerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName:
        Fn::Sub: ${ResourceNamePrefix}-alb-controller-policy
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - iam:CreateServiceLinkedRole
            Resource: '*'
            Condition:
              StringEquals:
                iam:AWSServiceName: elasticloadbalancing.amazonaws.com
          - Effect: Allow
            Action:
              - ec2:DescribeAccountAttributes
              - ec2:DescribeAddresses
              - ec2:DescribeAvailabilityZones
              - ec2:DescribeInternetGateways
              - ec2:DescribeVpcs
              - ec2:DescribeVpcPeeringConnections
              - ec2:DescribeSubnets
              - ec2:DescribeSecurityGroups
              - ec2:DescribeInstances
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribeTags
              - ec2:GetCoipPoolUsage
              - ec2:DescribeCoipPools
              - ec2:GetSecurityGroupsForVpc
              - ec2:DescribeIpamPools
              - ec2:DescribeRouteTables
              - elasticloadbalancing:DescribeLoadBalancers
              - elasticloadbalancing:DescribeLoadBalancerAttributes
              - elasticloadbalancing:DescribeListeners
              - elasticloadbalancing:DescribeListenerCertificates
              - elasticloadbalancing:DescribeSSLPolicies
              - elasticloadbalancing:DescribeRules
              - elasticloadbalancing:DescribeTargetGroups
              - elasticloadbalancing:DescribeTargetGroupAttributes
              - elasticloadbalancing:DescribeTargetHealth
              - elasticloadbalancing:DescribeTags
              - elasticloadbalancing:DescribeTrustStores
              - elasticloadbalancing:DescribeListenerAttributes
              - elasticloadbalancing:DescribeCapacityReservation
            Resource: '*'
          - Effect: Allow
            Action:
              - cognito-idp:DescribeUserPoolClient
              - acm:ListCertificates
              - acm:DescribeCertificate
              - iam:ListServerCertificates
              - iam:GetServerCertificate
              - waf-regional:GetWebACL
              - waf-regional:GetWebACLForResource
              - waf-regional:AssociateWebACL
              - waf-regional:DisassociateWebACL
              - wafv2:GetWebACL
              - wafv2:GetWebACLForResource
              - wafv2:AssociateWebACL
              - wafv2:DisassociateWebACL
              - shield:GetSubscriptionState
              - shield:DescribeProtection
              - shield:CreateProtection
              - shield:DeleteProtection
            Resource: '*'
          - Effect: Allow
            Action:
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:RevokeSecurityGroupIngress
            Resource: '*'
          - Effect: Allow
            Action:
              - ec2:CreateSecurityGroup
            Resource: '*'
          - Effect: Allow
            Action:
              - ec2:CreateTags
            Resource: arn:aws:ec2:*:*:security-group/*
            Condition:
              StringEquals:
                ec2:CreateAction: CreateSecurityGroup
              'Null':
                aws:RequestTag/elbv2.k8s.aws/cluster: 'false'
          - Effect: Allow
            Action:
              - ec2:CreateTags
              - ec2:DeleteTags
            Resource: arn:aws:ec2:*:*:security-group/*
            Condition:
              'Null':
                aws:RequestTag/elbv2.k8s.aws/cluster: 'true'
                aws:ResourceTag/elbv2.k8s.aws/cluster: 'false'
          - Effect: Allow
            Action:
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:RevokeSecurityGroupIngress
              - ec2:DeleteSecurityGroup
            Resource: '*'
            Condition:
              'Null':
                aws:ResourceTag/elbv2.k8s.aws/cluster: 'false'
          - Effect: Allow
            Action:
              - elasticloadbalancing:CreateLoadBalancer
              - elasticloadbalancing:CreateTargetGroup
            Resource: '*'
            Condition:
              'Null':
                aws:RequestTag/elbv2.k8s.aws/cluster: 'false'
          - Effect: Allow
            Action:
              - elasticloadbalancing:CreateListener
              - elasticloadbalancing:DeleteListener
              - elasticloadbalancing:CreateRule
              - elasticloadbalancing:DeleteRule
            Resource: '*'
          - Effect: Allow
            Action:
              - elasticloadbalancing:AddTags
              - elasticloadbalancing:RemoveTags
            Resource:
              - arn:aws:elasticloadbalancing:*:*:targetgroup/*/*
              - arn:aws:elasticloadbalancing:*:*:loadbalancer/net/*/*
              - arn:aws:elasticloadbalancing:*:*:loadbalancer/app/*/*
            Condition:
              'Null':
                aws:RequestTag/elbv2.k8s.aws/cluster: 'true'
                aws:ResourceTag/elbv2.k8s.aws/cluster: 'false'
          - Effect: Allow
            Action:
              - elasticloadbalancing:AddTags
              - elasticloadbalancing:RemoveTags
            Resource:
              - arn:aws:elasticloadbalancing:*:*:listener/net/*/*/*
              - arn:aws:elasticloadbalancing:*:*:listener/app/*/*/*
              - arn:aws:elasticloadbalancing:*:*:listener-rule/net/*/*/*
              - arn:aws:elasticloadbalancing:*:*:listener-rule/app/*/*/*
          - Effect: Allow
            Action:
              - elasticloadbalancing:ModifyLoadBalancerAttributes
              - elasticloadbalancing:SetIpAddressType
              - elasticloadbalancing:SetSecurityGroups
              - elasticloadbalancing:SetSubnets
              - elasticloadbalancing:DeleteLoadBalancer
              - elasticloadbalancing:ModifyTargetGroup
              - elasticloadbalancing:ModifyTargetGroupAttributes
              - elasticloadbalancing:DeleteTargetGroup
              - elasticloadbalancing:ModifyListenerAttributes
              - elasticloadbalancing:ModifyCapacityReservation
              - elasticloadbalancing:ModifyIpPools
            Resource: '*'
            Condition:
              'Null':
                aws:ResourceTag/elbv2.k8s.aws/cluster: 'false'
          - Effect: Allow
            Action:
              - elasticloadbalancing:AddTags
            Resource:
              - arn:aws:elasticloadbalancing:*:*:targetgroup/*/*
              - arn:aws:elasticloadbalancing:*:*:loadbalancer/net/*/*
              - arn:aws:elasticloadbalancing:*:*:loadbalancer/app/*/*
            Condition:
              StringEquals:
                elasticloadbalancing:CreateAction:
                  - CreateTargetGroup
                  - CreateLoadBalancer
              'Null':
                aws:RequestTag/elbv2.k8s.aws/cluster: 'false'
          - Effect: Allow
            Action:
              - elasticloadbalancing:RegisterTargets
              - elasticloadbalancing:DeregisterTargets
            Resource: arn:aws:elasticloadbalancing:*:*:targetgroup/*/*
          - Effect: Allow
            Action:
              - elasticloadbalancing:SetWebAcl
              - elasticloadbalancing:ModifyListener
              - elasticloadbalancing:AddListenerCertificates
              - elasticloadbalancing:RemoveListenerCertificates
              - elasticloadbalancing:ModifyRule
              - elasticloadbalancing:SetRulePriorities
            Resource: '*'
    Metadata:
      aws:cdk:path: InferenceAddonIamRolesCfnTemplate/AlbControllerPolicy
    Condition: ShouldCreateAlbControllerRole
  AlbControllerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Fn::Sub: >-
          {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Federated":"arn:aws:iam::${AWS::AccountId}:oidc-provider/${OIDCProviderURLWithoutProtocol}"},"Action":["sts:AssumeRoleWithWebIdentity"],"Condition":{"StringEquals":{"${OIDCProviderURLWithoutProtocol}:aud":"sts.amazonaws.com","${OIDCProviderURLWithoutProtocol}:sub":"system:serviceaccount:hyperpod-inference-system:aws-load-balancer-controller"}}}]}
      ManagedPolicyArns:
        - Ref: AlbControllerPolicy
      Path: /
      RoleName:
        Fn::Sub: ${ResourceNamePrefix}-alb-controller-role
    Metadata:
      aws:cdk:path: InferenceAddonIamRolesCfnTemplate/AlbControllerRole
    Condition: ShouldCreateAlbControllerRole
  JumpstartGatedModelRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Fn::Sub: >-
          {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"sagemaker.amazonaws.com"},"Action":"sts:AssumeRole"},{"Effect":"Allow","Principal":{"Federated":"arn:aws:iam::${AWS::AccountId}:oidc-provider/${OIDCProviderURLWithoutProtocol}"},"Action":"sts:AssumeRoleWithWebIdentity","Condition":{"StringLike":{"${OIDCProviderURLWithoutProtocol}:aud":"sts.amazonaws.com","${OIDCProviderURLWithoutProtocol}:sub":"system:serviceaccount:*:hyperpod-inference-service-account*"}}}]}
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSageMakerHyperPodGatedModelAccess
      Path: /
      RoleName:
        Fn::Sub: ${ResourceNamePrefix}-jumpstart-gated-model-role
    Metadata:
      aws:cdk:path: InferenceAddonIamRolesCfnTemplate/JumpstartGatedModelRole
    Condition: ShouldCreateJumpstartGatedModelRole
  InferenceOperatorExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Fn::Sub: >-
          {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"sagemaker.amazonaws.com"},"Action":"sts:AssumeRole"},{"Effect":"Allow","Principal":{"Federated":"arn:aws:iam::${AWS::AccountId}:oidc-provider/${OIDCProviderURLWithoutProtocol}"},"Action":"sts:AssumeRoleWithWebIdentity","Condition":{"StringLike":{"${OIDCProviderURLWithoutProtocol}:aud":"sts.amazonaws.com","${OIDCProviderURLWithoutProtocol}:sub":"system:serviceaccount:hyperpod-inference-system:hyperpod-inference-controller-manager"}}}]}
      Path: /
      Policies:
        - PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: S3BucketAccess
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetObject
                Resource:
                  - Fn::Sub: arn:aws:s3:::${ResourceNamePrefix}-tls-*
                  - Fn::Sub: arn:aws:s3:::${ResourceNamePrefix}-tls-*/*
                Condition:
                  StringEquals:
                    aws:PrincipalAccount:
                      Fn::Sub: ${AWS::AccountId}
              - Sid: ECRAuthorization
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: ECRRepositoryAccess
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:DescribeRepositories
                  - ecr:ListImages
                  - ecr:DescribeImages
                  - ecr:BatchGetImage
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion:
                      Fn::Sub: ${AWS::Region}
              - Sid: EC2DescribeAccess
                Effect: Allow
                Action:
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeRegions
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeRouteTables
                  - ec2:DescribeDhcpOptions
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceTypes
                  - ec2:DescribeVolumes
                  - ec2:DescribeVolumesModifications
                  - ec2:DescribeTags
                  - ec2:DescribeNetworkInterfaces
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion:
                      Fn::Sub: ${AWS::Region}
              - Sid: EC2NetworkInterfaceActions
                Effect: Allow
                Action:
                  - ec2:AssignPrivateIpAddresses
                  - ec2:AttachNetworkInterface
                  - ec2:CreateNetworkInterface
                  - ec2:DeleteNetworkInterface
                  - ec2:DetachNetworkInterface
                  - ec2:ModifyNetworkInterfaceAttribute
                  - ec2:UnassignPrivateIpAddresses
                  - ec2:CreateNetworkInterfacePermission
                  - ec2:CreateTags
                Resource:
                  - Fn::Sub: arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                  - Fn::Sub: arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*
                  - Fn::Sub: arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*
                  - Fn::Sub: arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*
                  - Fn::Sub: arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:vpc/*
                Condition:
                  StringEquals:
                    aws:RequestedRegion:
                      Fn::Sub: ${AWS::Region}
              - Sid: EKSClusterAccess
                Effect: Allow
                Action:
                  - eks:DescribeAddon
                  - eks:DescribeAddonVersions
                  - eks:DescribeCluster
                  - eks:DescribeIdentityProviderConfig
                  - eks:DescribeNodegroup
                  - eks:DescribePodIdentityAssociation
                  - eks:DescribeUpdate
                  - eks:ListAddons
                  - eks:ListClusters
                  - eks:ListFargateProfiles
                  - eks:ListIdentityProviderConfigs
                  - eks:ListNodegroups
                  - eks:ListPodIdentityAssociations
                  - eks:ListTagsForResource
                  - eks:ListUpdates
                  - eks:AccessKubernetesApi
                  - eks-auth:AssumeRoleForPodIdentity
                Resource:
                  Fn::Sub: arn:aws:eks:${AWS::Region}:${AWS::AccountId}:cluster/*
                Condition:
                  StringEquals:
                    aws:RequestedRegion:
                      Fn::Sub: ${AWS::Region}
                    aws:ResourceAccount:
                      Fn::Sub: ${AWS::AccountId}
              - Sid: EKSAccessEntryPolicyAssociation
                Effect: Allow
                Action:
                  - eks:AssociateAccessPolicy
                  - eks:DisassociateAccessPolicy
                Resource: arn:aws:eks:*:*:access-entry/*
                Condition:
                  StringEquals:
                    eks:policyarn: arn:aws:eks::aws:cluster-access-policy/AmazonSagemakerHyperpodInferenceMonitoringPolicy
              - Sid: ELBDescribeAccess
                Effect: Allow
                Action:
                  - elasticloadbalancing:DescribeAccountLimits
                  - elasticloadbalancing:DescribeListeners
                  - elasticloadbalancing:DescribeLoadBalancerAttributes
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeRules
                  - elasticloadbalancing:DescribeSSLPolicies
                  - elasticloadbalancing:DescribeTags
                  - elasticloadbalancing:DescribeTargetGroupAttributes
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeTargetHealth
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion:
                      Fn::Sub: ${AWS::Region}
              - Sid: ELBCreateAccess
                Effect: Allow
                Action:
                  - elasticloadbalancing:CreateListener
                  - elasticloadbalancing:CreateLoadBalancer
                  - elasticloadbalancing:CreateRule
                  - elasticloadbalancing:CreateTargetGroup
                Resource:
                  Fn::Sub: arn:aws:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:*/*
                Condition:
                  StringEquals:
                    aws:RequestedRegion:
                      Fn::Sub: ${AWS::Region}
              - Sid: SageMakerListAccess
                Effect: Allow
                Action:
                  - sagemaker:ListModels
                  - sagemaker:ListTags
                  - sagemaker:DescribeHubContent
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion:
                      Fn::Sub: ${AWS::Region}
              - Sid: SageMakerCreateAccess
                Effect: Allow
                Action:
                  - sagemaker:CreateModel
                  - sagemaker:CreateEndpointConfig
                  - sagemaker:CreateEndpoint
                  - sagemaker:AddTags
                Resource:
                  - Fn::Sub: arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:model/*
                  - Fn::Sub: arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:endpoint/*
                  - Fn::Sub: arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:endpoint-config/*
                  - Fn::Sub: arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:cluster/*
                  - Fn::Sub: arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:cluster-inference/*
                Condition:
                  StringEquals:
                    aws:RequestedRegion:
                      Fn::Sub: ${AWS::Region}
                    aws:RequestTag/CreatedBy: HyperPodInference
                    aws:ResourceAccount:
                      Fn::Sub: ${AWS::AccountId}
              - Sid: SageMakerDeleteAccess
                Effect: Allow
                Action:
                  - sagemaker:DeleteModel
                  - sagemaker:DeleteEndpointConfig
                  - sagemaker:DeleteEndpoint
                  - sagemaker:UpdateEndpoint
                Resource:
                  - Fn::Sub: arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:model/*
                  - Fn::Sub: arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:endpoint/*
                  - Fn::Sub: arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:endpoint-config/*
                  - Fn::Sub: arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:cluster/*
                  - Fn::Sub: arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:cluster-inference/*
                Condition:
                  StringEquals:
                    aws:RequestedRegion:
                      Fn::Sub: ${AWS::Region}
                    aws:ResourceTag/CreatedBy: HyperPodInference
                    aws:ResourceAccount:
                      Fn::Sub: ${AWS::AccountId}
              - Sid: FSxAccess
                Effect: Allow
                Action:
                  - fsx:DescribeFileSystems
