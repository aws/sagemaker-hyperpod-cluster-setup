Description: S3 Bucket Stack for TLS Certificates
Parameters:
  ResourceNamePrefix:
    Type: String
    Default: sagemaker-hyperpod-eks
    Description: Prefix to be used for all resources created by this template.
  ResourceNameShortPrefix:
    Type: String
    Default: smhp1eks
    Description: Short prefix (8-char hash from UI) for resources with name length constraints.
  AccessLogsBucketName:
    Type: String
    Default: ''
    Description: Name of the S3 bucket to use for access logs.
Conditions:
  NeedsAccessLogsBucketCondition:
    Fn::Equals:
      - Ref: AccessLogsBucketName
      - ''
Resources:
  AccessLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      BucketName:
        Fn::Join:
          - '-'
          - - Fn::Sub:
                - hp-${ResourceNameShortPrefix}-access-logs
                - ResourceNameShortPrefix:
                    Ref: ResourceNameShortPrefix
            - Fn::Select:
                - 0
                - Fn::Split:
                    - '-'
                    - Fn::Select:
                        - 2
                        - Fn::Split:
                            - /
                            - Ref: AWS::StackId
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: CreatedBy
          Value: HyperPodInference
    Metadata:
      aws:cdk:path: TLSCertificatesS3BucketCfnTemplate/AccessLogsBucket
    Condition: NeedsAccessLogsBucketCondition
  LoggingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: AccessLogsBucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: DenyUnsecuredTransport
            Effect: Deny
            Principal:
              AWS: '*'
            Action: s3:*
            Resource:
              - Fn::Join:
                  - ''
                  - - 'arn:aws:s3:::'
                    - Ref: AccessLogsBucket
              - Fn::Join:
                  - ''
                  - - 'arn:aws:s3:::'
                    - Ref: AccessLogsBucket
                    - /*
            Condition:
              Bool:
                aws:SecureTransport: 'false'
    Metadata:
      aws:cdk:path: TLSCertificatesS3BucketCfnTemplate/LoggingBucketPolicy
    Condition: NeedsAccessLogsBucketCondition
  TLSCertificatesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      BucketName:
        Fn::Join:
          - '-'
          - - hyperpod-tls
            - Ref: ResourceNameShortPrefix
            - Fn::Select:
                - 0
                - Fn::Split:
                    - '-'
                    - Fn::Select:
                        - 2
                        - Fn::Split:
                            - /
                            - Ref: AWS::StackId
      LoggingConfiguration:
        DestinationBucketName:
          Fn::If:
            - NeedsAccessLogsBucketCondition
            - Ref: AccessLogsBucket
            - Ref: AccessLogsBucketName
        LogFilePrefix: tls-cert-logs/
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: CreatedBy
          Value: HyperPodInference
    Metadata:
      aws:cdk:path: TLSCertificatesS3BucketCfnTemplate/TLSCertificatesBucket
  TLSBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: TLSCertificatesBucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: DenyUnsecuredTransport
            Effect: Deny
            Principal:
              AWS: '*'
            Action: s3:*
            Resource:
              - Fn::Join:
                  - ''
                  - - 'arn:aws:s3:::'
                    - Ref: TLSCertificatesBucket
              - Fn::Join:
                  - ''
                  - - 'arn:aws:s3:::'
                    - Ref: TLSCertificatesBucket
                    - /*
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: AllowALBAccessLogDelivery
            Effect: Allow
            Principal:
              Service: logdelivery.elasticloadbalancing.amazonaws.com
            Action: s3:PutObject
            Resource:
              Fn::Join:
                - ''
                - - 'arn:aws:s3:::'
                  - Ref: TLSCertificatesBucket
                  - /data-capture/*
            Condition:
              StringEquals:
                aws:SourceAccount:
                  Ref: AWS::AccountId
    Metadata:
      aws:cdk:path: TLSCertificatesS3BucketCfnTemplate/TLSBucketPolicy
Outputs:
  TLSCertificatesBucketName:
    Description: TLS Certificates S3 Bucket Name
    Value:
      Ref: TLSCertificatesBucket
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-TLSCertificatesBucketName
  TLSCertificatesBucketArn:
    Description: TLS Certificates S3 Bucket ARN
    Value:
      Fn::GetAtt:
        - TLSCertificatesBucket
        - Arn
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-TLSCertificatesBucketArn
