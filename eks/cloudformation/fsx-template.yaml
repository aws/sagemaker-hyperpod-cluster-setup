Description: Fsx Stack
Parameters:
  ResourceNamePrefix:
    Type: String
    Default: sagemaker-hyperpod-eks
    Description: Prefix to be used for all resources created by this template.
  HelmChartStatus:
    Type: String
    Default: HelmChartNotRequired
    Description: Conditionally wait on HelmChartStack if deployed
  EKSClusterName:
    Type: String
    Default: hyperpod-eks-cluster
    Description: The name of the EKS cluster you wish to use.
  CustomResourceS3Bucket:
    Type: String
    Default: aws-sagemaker-hyperpod-cluster-setup-us-east-2-prod
    Description: The name of the S3 bucket containing the custom resource.
  HelmLayerS3Key:
    Type: String
    Default: resources/artifacts/helm-lambda-layer.zip
    Description: The S3 key for the lambda layer zip file.
  HelmFunctionS3Key:
    Type: String
    Default: resources/artifacts/helm-lambda-function.zip
    Description: The S3 key for the lambda function zip file.
  FsxLayerS3Key:
    Type: String
    Default: resources/artifacts/fsx-lambda-layer.zip
    Description: The S3 key for the lambda layer zip file.
  FsxFunctionS3Key:
    Type: String
    Default: resources/artifacts/fsx-lambda-function.zip
    Description: The S3 key for the lambda function zip file.
  PrivateSubnetIds:
    Type: String
    Description: Comma-separated list of private subnet IDs
  FsxSubnetId:
    Type: String
    Description: The subnet id that will be used to create FSx
  FsxAvailabilityZoneId:
    Type: String
    Description: The availability zone to get subnet id that will be used to create FSx
  SecurityGroupIds:
    Type: String
    Description: ID of the security group to use
  PerUnitStorageThroughput:
    Type: Number
    Default: 250
    Description: Per unit storage throughput for the FSx file system
  DataCompressionType:
    Type: String
    Default: NONE
    AllowedValues:
      - NONE
      - LZ4
    Description: Data compression type for the FSx file system (NONE, LZ4)
  FileSystemTypeVersion:
    Type: Number
    Default: 2.15
    Description: File system type version for the FSx file system
  StorageCapacity:
    Type: Number
    Default: 1200
    Description: Storage capacity for the FSx file system in GiB
  DeploymentType:
    Type: String
    Default: PERSISTENT_2
    Description: Deployment type for the FSx file system
  FsxFileSystemId:
    Type: String
    Default: ''
    Description: Existing FSx for Lustre file system
Conditions:
  UseFsxFileSystemIdCondition:
    Fn::Not:
      - Fn::Equals:
          - Ref: FsxFileSystemId
          - ''
  FsxSubnetIdIsEmptyCondition:
    Fn::Equals:
      - Ref: FsxSubnetId
      - ''
  IsPersistent2DeploymentTypeCondition:
    Fn::Equals:
      - Ref: DeploymentType
      - PERSISTENT_2
  CreateNewFsxCondition:
    Fn::Not:
      - Condition: UseFsxFileSystemIdCondition
Resources:
  FsxLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Path: /
      Policies:
        - PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeSubnets
                  - ec2:DescribeAvailabilityZones
                  - fsx:DescribeFileSystems
                Resource: '*'
          PolicyName: FsxLambdaPolicy
    Metadata:
      aws:cdk:path: FsxCfnTemplate/FsxLambdaExecutionRole
  FsxHelperFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import json
          import logging

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def handler(event, context):
              logger.info(f"Received event: {json.dumps(event)}")
              
              response_data = {}
              
              # Return immediately if this is a DELETE request
              if event.get('RequestType') == 'Delete':
                  logger.info("Delete request received. Returning early.")
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                  return
              
              try:
                  # Extract parameters
                  properties = event['ResourceProperties']
                  fsxFileSystemId = properties.get('FsxFileSystemId', '')
                  fsxSubnetId = properties.get('FsxSubnetId', '')
                  fsxAvailabilityZoneId = properties.get('FsxAvailabilityZoneId', '')
                  privateSubnetIds = properties.get('PrivateSubnetIds', '').split(',')
                  
                  # Check if we need to find a subnet or describe FSx
                  if fsxFileSystemId == '':
                      # No FSx file system ID provided, we may need to find a subnet
                      if fsxSubnetId == '':
                          # Need to find a subnet in the specified AZ
                          ec2 = boto3.client('ec2')
                          selected_subnet = None
                          
                          logger.info(f"Finding subnet in AZ ID: {fsxAvailabilityZoneId}")
                          logger.info(f"Available private subnets: {privateSubnetIds}")
                          
                          if fsxAvailabilityZoneId and privateSubnetIds:
                              for subnet_id in privateSubnetIds:
                                  try:
                                      subnet_info = ec2.describe_subnets(SubnetIds=[subnet_id.strip()])
                                      if subnet_info['Subnets']:
                                          subnet = subnet_info['Subnets'][0]
                                          if subnet['AvailabilityZoneId'] == fsxAvailabilityZoneId:
                                              selected_subnet = subnet_id.strip()
                                              logger.info(f"Selected subnet {selected_subnet} in AZ ID {fsxAvailabilityZoneId}")
                                              break
                                  except Exception as e:
                                      logger.error(f"Error checking subnet {subnet_id}: {str(e)}")
                          
                          if selected_subnet:
                              response_data['SubnetId'] = selected_subnet
                          else:
                              error_msg = f"No subnet found in availability zone ID {fsxAvailabilityZoneId}"
                              logger.error(error_msg)
                              cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': error_msg})
                              return
                      else:
                          # Use provided subnet ID
                          response_data['SubnetId'] = fsxSubnetId
                  else:
                      # FSx file system ID provided, get the mount name
                      fsx = boto3.client('fsx')
                      try:
                          response = fsx.describe_file_systems(FileSystemIds=[fsxFileSystemId])
                          if response['FileSystems']:
                              fs = response['FileSystems'][0]
                              if 'LustreConfiguration' in fs:
                                  mount_name = fs['LustreConfiguration'].get('MountName', '')
                                  response_data['FSxMountName'] = mount_name
                                  response_data['FileSystemId'] = fsxFileSystemId
                                  logger.info(f"Found FSx file system {fsxFileSystemId} with mount name {mount_name}")
                              else:
                                  error_msg = f"The file system {fsxFileSystemId} is not a Lustre file system"
                                  logger.error(error_msg)
                                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': error_msg})
                                  return
                          else:
                              error_msg = f"FSx file system {fsxFileSystemId} not found"
                              logger.error(error_msg)
                              cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': error_msg})
                              return
                      except Exception as e:
                          error_msg = f"Error describing FSx file system: {str(e)}"
                          logger.error(error_msg)
                          cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': error_msg})
                          return
                  
                  # Send success response
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, response_data)
                  
              except Exception as e:
                  logger.error(f"Exception: {str(e)}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})
      Handler: index.handler
      Role:
        Fn::GetAtt:
          - FsxLambdaExecutionRole
          - Arn
      Runtime: python3.10
      Timeout: 60
    Metadata:
      aws:cdk:path: FsxCfnTemplate/FsxHelperFunction
  FsxHelperResource:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken:
        Fn::GetAtt:
          - FsxHelperFunction
          - Arn
      FsxFileSystemId:
        Ref: FsxFileSystemId
      FsxSubnetId:
        Ref: FsxSubnetId
      FsxAvailabilityZoneId:
        Ref: FsxAvailabilityZoneId
      PrivateSubnetIds:
        Ref: PrivateSubnetIds
      Timestamp: '1767992302774'
    Metadata:
      aws:cdk:path: FsxCfnTemplate/FsxHelperResource
  FSxLustreFileSystem:
    Type: AWS::FSx::FileSystem
    Properties:
      FileSystemType: LUSTRE
      FileSystemTypeVersion:
        Ref: FileSystemTypeVersion
      LustreConfiguration:
        DataCompressionType:
          Ref: DataCompressionType
        DeploymentType:
          Ref: DeploymentType
        MetadataConfiguration:
          Fn::If:
            - IsPersistent2DeploymentTypeCondition
            - Mode: AUTOMATIC
            - Ref: AWS::NoValue
        PerUnitStorageThroughput:
          Ref: PerUnitStorageThroughput
      SecurityGroupIds:
        - Ref: SecurityGroupIds
      StorageCapacity:
        Ref: StorageCapacity
      StorageType: SSD
      SubnetIds:
        - Fn::If:
            - FsxSubnetIdIsEmptyCondition
            - Fn::GetAtt:
                - FsxHelperResource
                - SubnetId
            - Ref: FsxSubnetId
      Tags:
        - Key: aws-sagemaker-hyperpod-prerequiste
          Value:
            Fn::Sub: ${ResourceNamePrefix}-fsx-lustre
        - Key: Name
          Value:
            Fn::Sub: ${ResourceNamePrefix}-fsx-lustre
    Metadata:
      aws:cdk:path: FsxCfnTemplate/FSxLustreFileSystem
    Condition: CreateNewFsxCondition
  FsxCustomResourceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
        Version: 2012-10-17
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - eks:DescribeCluster
                  - eks:TagResource
                Resource:
                  Fn::Sub: arn:aws:eks:${AWS::Region}:${AWS::AccountId}:cluster/${EKSClusterName}
          PolicyName:
            Fn::Sub: ${ResourceNamePrefix}-EKSAccess
        - PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - iam:GetOpenIDConnectProvider
                  - iam:CreateOpenIDConnectProvider
                  - iam:TagOpenIDConnectProvider
                Resource:
                  Fn::Sub: arn:aws:iam::${AWS::AccountId}:oidc-provider/*
              - Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:DetachRolePolicy
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:TagRole
                  - iam:AttachRolePolicy
                Resource:
                  Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/*
          PolicyName:
            Fn::Sub: ${ResourceNamePrefix}-IAMAccess
        - PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:ListStacks
                  - cloudformation:CreateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:SignalResource
                  - cloudformation:DeleteStack
                Resource:
                  Fn::Sub: arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/*
          PolicyName:
            Fn::Sub: ${ResourceNamePrefix}-CFNAccess
        - PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeSubnets
                Resource: '*'
          PolicyName:
            Fn::Sub: ${ResourceNamePrefix}-EC2Access
        - PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - fsx:DescribeFileSystems
                Resource: '*'
          PolicyName:
            Fn::Sub: ${ResourceNamePrefix}-FSxAccess
    Metadata:
      aws:cdk:path: FsxCfnTemplate/FsxCustomResourceRole
  FsxCustomResourceAccessEntry:
    Type: AWS::EKS::AccessEntry
    Properties:
      AccessPolicies:
        - AccessScope:
            Type: cluster
          PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
      ClusterName:
        Ref: EKSClusterName
      PrincipalArn:
        Fn::GetAtt:
          - FsxCustomResourceRole
          - Arn
    Metadata:
      aws:cdk:path: FsxCfnTemplate/FsxCustomResourceAccessEntry
  FsxCustomResourceLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      CompatibleArchitectures:
        - x86_64
      CompatibleRuntimes:
        - python3.9
        - python3.10
        - python3.11
        - python3.12
      Content:
        S3Bucket:
          Ref: CustomResourceS3Bucket
        S3Key:
          Ref: FsxLayerS3Key
      Description: Lambda Layer for kubectl, helm, and git tools
      LayerName:
        Fn::Sub: ${ResourceNamePrefix}-fsx-layer1
    Metadata:
      aws:cdk:path: FsxCfnTemplate/FsxCustomResourceLayer
  FsxCustomResourceFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket:
          Ref: CustomResourceS3Bucket
        S3Key:
          Ref: FsxFunctionS3Key
      Environment:
        Variables:
          CLUSTER_NAME:
            Ref: EKSClusterName
          PRIVATE_SUBNET_IDS:
            Ref: PrivateSubnetIds
          FSX_SUBNETID:
            Ref: FsxSubnetId
          FSX_AVAILABILITY_ZONE:
            Ref: FsxAvailabilityZoneId
          SECURITY_GROUP_ID:
            Ref: SecurityGroupIds
          PER_UNIT_STORAGE_THROUGHPUT:
            Ref: PerUnitStorageThroughput
          DATA_COMPRESSION_TYPE:
            Ref: DataCompressionType
          FILE_SYSTEM_TYPE_VERSION:
            Ref: FileSystemTypeVersion
          STORAGE_CAPACITY:
            Ref: StorageCapacity
          DEPLOYMENT_TYPE:
            Ref: DeploymentType
          FSX_FILE_SYSTEM_ID:
            Fn::If:
              - UseFsxFileSystemIdCondition
              - Ref: FsxFileSystemId
              - Ref: FSxLustreFileSystem
          PATH: /opt/python/bin:/var/lang/bin:/usr/local/bin:/usr/bin/:/bin
          GIT_EXEC_PATH: /opt/python/libexec/git-core
          KUBECONFIG: /tmp/.kube/config
          LD_LIBRARY_PATH: /opt/python/lib
      FunctionName:
        Fn::Sub: ${ResourceNamePrefix}fsxfunc1
      Handler: lambda_function.lambda_handler
      Layers:
        - Ref: FsxCustomResourceLayer
      Role:
        Fn::GetAtt:
          - FsxCustomResourceRole
          - Arn
      Runtime: python3.12
      Timeout: 600
    DependsOn:
      - FsxCustomResourceAccessEntry
    Metadata:
      aws:cdk:path: FsxCfnTemplate/FsxCustomResourceFunction
  FsxCustomResourceStep1:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken:
        Fn::GetAtt:
          - FsxCustomResourceFunction
          - Arn
    Metadata:
      aws:cdk:path: FsxCfnTemplate/FsxCustomResourceStep1
  FSxCsiAddon:
    Type: AWS::EKS::Addon
    Properties:
      AddonName: aws-fsx-csi-driver
      ClusterName:
        Ref: EKSClusterName
      PreserveOnDelete: false
      ResolveConflicts: OVERWRITE
    DependsOn:
      - FsxCustomResourceStep1
    Metadata:
      aws:cdk:path: FsxCfnTemplate/FSxCsiAddon
  FsxCustomResourceStep2:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken:
        Fn::GetAtt:
          - FsxCustomResourceFunction
          - Arn
    DependsOn:
      - FSxCsiAddon
    Metadata:
      aws:cdk:path: FsxCfnTemplate/FsxCustomResourceStep2
Outputs:
  FsxDeploymentComplete:
    Description: Indicates fsx deployment is complete
    Value: FsxDeploymentComplete
