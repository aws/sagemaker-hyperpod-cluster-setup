Parameters:
  EKSClusterName:
    Type: String
    Description: Name of the EKS cluster
  HyperPodClusterArn:
    Type: String
    Description: ARN of the HyperPod cluster
  PriorityClasses:
    Type: String
    Default: ''
    Description: JSON string containing priority classes configuration. Leave empty to use default priority classes.
  FairShare:
    Type: String
    Default: Disabled
    AllowedValues:
      - Enabled
      - Disabled
    Description: Fair share setting for the scheduler configuration
  IdleResourceSharing:
    Type: String
    Default: Enabled
    AllowedValues:
      - Enabled
      - Disabled
    Description: Enable or disable idle compute resource sharing among different workloads
Conditions:
  UseDefaultPriorityClassesCondition:
    Fn::Equals:
      - Ref: PriorityClasses
      - ''
Resources:
  TaskGovernanceAddOn:
    Type: AWS::EKS::Addon
    Properties:
      AddonName: amazon-sagemaker-hyperpod-taskgovernance
      ClusterName:
        Ref: EKSClusterName
      ResolveConflicts: OVERWRITE
    Metadata:
      aws:cdk:path: TaskGovernanceClusterPolicyCfnTemplate/TaskGovernanceAddOn
  ClusterSchedulerConfig:
    Type: Custom::ClusterSchedulerConfig
    Properties:
      ServiceToken:
        Fn::ImportValue:
          Fn::Sub: TaskGovernanceAddonLambdaArn-${EKSClusterName}
      ClusterArn:
        Ref: HyperPodClusterArn
      Name:
        Fn::Sub: ${EKSClusterName}-scheduler-config
      Description: >-
        Cluster configuration policy to streamline priority for tasks and idle compute management with first-come,
        first-served allocation for idle compute
      SchedulerConfig:
        Fn::If:
          - UseDefaultPriorityClassesCondition
          - FairShare:
              Ref: FairShare
            IdleResourceSharing:
              Ref: IdleResourceSharing
            PriorityClasses:
              - Name: inference
                Weight: 100
              - Name: experimentation
                Weight: 90
              - Name: training
                Weight: 80
              - Name: fine-tuning
                Weight: 70
              - Name: interactive
                Weight: 60
          - FairShare:
              Ref: FairShare
            IdleResourceSharing:
              Ref: IdleResourceSharing
            PriorityClasses:
              Ref: PriorityClasses
    DependsOn:
      - TaskGovernanceAddOn
    Metadata:
      aws:cdk:path: TaskGovernanceClusterPolicyCfnTemplate/ClusterSchedulerConfig
Outputs:
  ClusterSchedulerConfigArn:
    Description: ARN of the cluster scheduler configuration
    Value:
      Fn::GetAtt:
        - ClusterSchedulerConfig
        - ClusterSchedulerConfigArn
  ClusterSchedulerConfigId:
    Description: ID of the cluster scheduler configuration
    Value:
      Fn::GetAtt:
        - ClusterSchedulerConfig
        - ClusterSchedulerConfigId
  TaskGovernanceAddonName:
    Description: Name of the task governance addon
    Value:
      Ref: TaskGovernanceAddOn
