Outputs:
  InfOperatorIAMRoleArn:
    Description: Inference Operator IAM Role ARN
    Value:
      Fn::If:
        - CreateInferenceOperatorExecutionRoleCondition
        - Fn::GetAtt:
            - InferenceAddonIamRolesStack
            - Outputs.InferenceOperatorExecutionRoleArn
        - Ref: InferenceOperatorExecutionRoleArn
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-InfOperatorIAMRoleArn
  InfOperatorIAMRoleName:
    Description: Inference Operator IAM Role Name
    Value:
      Fn::If:
        - CreateInferenceOperatorExecutionRoleCondition
        - Fn::GetAtt:
            - InferenceAddonIamRolesStack
            - Outputs.InferenceOperatorExecutionRoleName
        - Fn::Select:
            - 1
            - Fn::Split:
                - /
                - Fn::Select:
                    - 5
                    - Fn::Split:
                        - ':'
                        - Ref: InferenceOperatorExecutionRoleArn
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-InfOperatorIAMRoleName
  TLSCertificatesBucketName:
    Description: TLS Certificates S3 Bucket Name
