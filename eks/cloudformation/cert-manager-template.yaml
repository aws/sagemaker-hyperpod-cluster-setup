Description: Cert-Manager Installation Stack for HyperPod Operators
Parameters:
  ResourceNamePrefix:
    Type: String
    Default: sagemaker-hyperpod-eks
    Description: Prefix to be used for all resources created by this template.
  EKSClusterName:
    Type: String
    Description: The name of the EKS cluster where cert-manager will be installed.
  CertManagerAddonVersion:
    Type: String
    Default: v1.18.2-eksbuild.2
    Description: Version of the cert-manager EKS add-on to install
  CustomResourceS3Bucket:
    Type: String
    Default: aws-sagemaker-hyperpod-cluster-setup-us-east-2-prod
    Description: The name of the S3 bucket containing the custom resource.
  LayerS3Key:
    Type: String
    Default: resources/artifacts/cert-manager-lambda-layer.zip
    Description: The S3 key for the lambda layer zip file.
  FunctionS3Key:
    Type: String
    Default: resources/artifacts/cert-manager-lambda-function.zip
    Description: The S3 key for the lambda function zip file.
Resources:
  CertManagerCustomResourceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
        Version: 2012-10-17
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - eks:DescribeCluster
                  - eks:DescribeAddon
                  - eks:CreateAddon
                  - eks:DeleteAddon
                  - eks:UpdateAddon
                Resource:
                  - Fn::Sub: arn:aws:eks:${AWS::Region}:${AWS::AccountId}:cluster/${EKSClusterName}
                  - Fn::Sub: arn:aws:eks:${AWS::Region}:${AWS::AccountId}:addon/${EKSClusterName}/cert-manager/*
          PolicyName:
            Fn::Sub: ${ResourceNamePrefix}-CertMgr-Addon-Access
    Metadata:
      aws:cdk:path: CertManagerCfnTemplate/CertManagerCustomResourceRole
  CertManagerCustomResourceAccessEntry:
    Type: AWS::EKS::AccessEntry
    Properties:
      AccessPolicies:
        - AccessScope:
            Type: cluster
          PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
      ClusterName:
        Ref: EKSClusterName
      PrincipalArn:
        Fn::GetAtt:
          - CertManagerCustomResourceRole
          - Arn
    Metadata:
      aws:cdk:path: CertManagerCfnTemplate/CertManagerCustomResourceAccessEntry
  CertManagerCustomResourceLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      CompatibleArchitectures:
        - x86_64
      CompatibleRuntimes:
        - python3.9
        - python3.10
        - python3.11
        - python3.12
      Content:
        S3Bucket:
          Ref: CustomResourceS3Bucket
        S3Key:
          Ref: LayerS3Key
      Description: Lambda Layer for kubectl tools for cert-manager installation
      LayerName:
        Fn::Sub: ${ResourceNamePrefix}-cert-mgr-layer
    Metadata:
      aws:cdk:path: CertManagerCfnTemplate/CertManagerCustomResourceLayer
  CertManagerCustomResourceFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket:
          Ref: CustomResourceS3Bucket
        S3Key:
          Ref: FunctionS3Key
      Environment:
        Variables:
          EKS_CLUSTER_NAME:
            Ref: EKSClusterName
          CERT_MANAGER_ADDON_VERSION:
            Ref: CertManagerAddonVersion
          PATH: /opt/python/bin:/var/lang/bin:/usr/local/bin:/usr/bin/:/bin
          KUBECONFIG: /tmp/.kube/config
          LD_LIBRARY_PATH: /opt/python/lib
      FunctionName:
        Fn::Sub: ${ResourceNamePrefix}-certfunc
      Handler: lambda_function.lambda_handler
      Layers:
        - Ref: CertManagerCustomResourceLayer
      MemorySize: 1024
      Role:
        Fn::GetAtt:
          - CertManagerCustomResourceRole
          - Arn
      Runtime: python3.12
      Timeout: 900
    DependsOn:
      - CertManagerCustomResourceAccessEntry
    Metadata:
      aws:cdk:path: CertManagerCfnTemplate/CertManagerCustomResourceFunction
  CertManagerCustomResource:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken:
        Fn::GetAtt:
          - CertManagerCustomResourceFunction
          - Arn
    DependsOn:
      - CertManagerCustomResourceFunction
    Metadata:
      aws:cdk:path: CertManagerCfnTemplate/CertManagerCustomResource
Outputs:
  CertManagerAddonStatus:
    Description: Status of cert-manager add-on installation
    Value:
      Fn::GetAtt:
        - CertManagerCustomResource
        - AddonStatus
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-CertManagerAddonStatus
  CertManagerCustomResourceArn:
    Description: ARN of the cert-manager custom resource
    Value:
      Ref: CertManagerCustomResource
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-CertManagerCustomResourceArn
  CertManagerAddonArn:
    Description: ARN of the cert-manager EKS Add-on
    Value:
      Fn::GetAtt:
        - CertManagerCustomResource
        - AddonArn
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-CertManagerAddonArn
